name: Chart Lint

env:
  HELM_VERSION: v3.21.4
  README_GENERATOR_VERSION: 3.0.1

on:
  push:
    # Exclude branches created by Dependabot to avoid triggering current workflow
    # for PRs initiated by Dependabot.
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/lint-chart.yaml"
      - "Makefile"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chart-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Install readme-generator-for-helm
        run: npm install --global --ignore-scripts --no-audit --no-fund https://github.com/bitnami/readme-generator-for-helm/archive/refs/tags/${{ env.README_GENERATOR_VERSION }}.tar.gz

      - name: Add HAMi DRA Helm repository
        run: |
          helm repo add hami-dra https://project-hami.github.io/HAMi-DRA/
          helm repo update hami-dra

      - name: Validate chart
        run: make verify_chart
