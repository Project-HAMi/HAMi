name: CI Workflow
on:
  # Run this workflow every time a new commit pushed to upstream/fork repository.
  # Run workflow on fork repository will help contributors find and resolve issues before sending a PR.
  pull_request:
  push:
    # Exclude branches created by Dependabot to avoid triggering current workflow
    # for PRs initiated by Dependabot.
    branches-ignore:
      - 'dependabot/**'
permissions:
  contents: read  # for actions/checkout to fetch code

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_REPO: ${{ secrets.IMAGE_REPO || 'projecthami/hami' }}
  IMAGE_REPO_HAMICORE: ${{ secrets.IMAGE_REPO || 'projecthami/hamicore' }}
  IMAGE_ROOT_PATH: docker
  BUILD_PLATFORM: linux/arm64,linux/amd64
  REGISTER_USER: ${{ github.actor }}
  REGISTER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-22.04
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: verify license
        run: hack/verify-license.sh
      - name: go tidy
        run: make tidy
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          install-mode: goinstall
      - name: import alias
        run: hack/verify-import-aliases.sh

  get_info:
    name: get_info
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.parse_version.outputs.version }}
      e2e_run: ${{ steps.parse_code.outputs.e2e_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Parse the version
        id: parse_version
        run: |
          value=$(make -f Makefile.defs print-version)
          suffix="$(git rev-parse --short HEAD)"
          tag="${value}-${suffix}"
          echo "version=${tag}" >> $GITHUB_OUTPUT
      # Check the code diff, ignore the docs and examples change
      - name: Parse the code diff
        id: parse_code
        run: |
          pr_commit=${{ github.event.pull_request.base.sha }}
          base_commit=${{ github.sha }}
          echo "PR commit: ${pr_commit}"
          echo "Git log: $(git log ${pr_commit})"
          echo "Base commit: ${base_commit}"
          echo "Git log: $(git log ${base_commit})"
          changed_files=$(git diff --name-only ${pr_commit} ${base_commit} -- . ':(exclude)docs/*' ':(exclude)examples/*' ':(exclude)*.md')
          echo "Changed files: ${changed_files}"
          if [ -n "$changed_files" ]; then
            echo "Will run e2e-test"
            echo "e2e_run=true" >> $GITHUB_OUTPUT
          else
            echo "Won't run e2e-test"
            echo "e2e_run=false" >> $GITHUB_OUTPUT
          fi

  test:
    name: Unit test
    needs: [ lint, get_info ] # rely on lint & get_info successful completion
    runs-on: ubuntu-22.04
    if: needs.get_info.outputs.e2e_run == 'true' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Checkout submodule
        uses: Mushus/checkout-submodule@f6a7fddc9798c8f8728b252594243ced3b56e550 # v1.0.1
        with:
          basePath: # optional, default is .
          submodulePath: libvgpu
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: make tidy
      - run: make test
      - name: Upload coverage to Codecov
        # Prevent running from the forked repository that doesn't need to upload coverage.
        # In addition, running on the forked repository would fail as missing the necessary secret.
        if: ${{ github.repository == 'Project-HAMi/HAMi' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          # Even though token upload token is not required for public repos,
          # but adding a token might increase successful uploads as per:
          # https://community.codecov.com/t/upload-issues-unable-to-locate-build-via-github-actions-api/3954
          token: ${{secrets.CODECOV_TOKEN}}
          files: ./_output/coverage/coverage.out
          flags: unittests
          fail_ci_if_error: false
          verbose: true

  bench:
    name: Benchmark
    # Runs alongside the unit tests rather than after them: the two share no
    # artifacts, so serialising them would only add wall-clock time.
    needs: [ lint, get_info ]
    runs-on: ubuntu-22.04
    if: needs.get_info.outputs.e2e_run == 'true' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The libvgpu submodule holds no Go sources, so unlike the unit test job
      # this one does not need it to build the benchmarks.
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Run benchmarks
        # A low benchtime keeps this a smoke test: the job proves every
        # benchmark still runs, and deliberately does not compare timings,
        # which are not reproducible on shared runners.
        run: BENCHTIME=10x make bench
      - name: Upload benchmark results
        # Uploaded even on failure so the partial output shows which benchmark
        # broke.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-results
          path: _output/bench/results.txt
          retention-days: 5
          if-no-files-found: warn

  build:
    name: Compile
    needs: [ test, get_info ]
    runs-on: ubuntu-22.04
    if: needs.get_info.outputs.e2e_run == 'true' || github.ref == 'refs/heads/master'
    steps:
      - name: Free disk space
        # https://github.com/actions/virtual-environments/issues/709
        run: |
          echo "=========original CI disk space"
          df -h
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "=========after clean up, the left CI disk space"
          df -h

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout submodule
        uses: Mushus/checkout-submodule@f6a7fddc9798c8f8728b252594243ced3b56e550 # v1.0.1
        with:
          basePath: # optional, default is .
          submodulePath: libvgpu

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4
        with:
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}

      - name: Build & Pushing hami image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.IMAGE_ROOT_PATH }}/Dockerfile
          labels: ${{ needs.get_info.outputs.version }}
          build-args: |
            VERSION=${{ needs.get_info.outputs.version }}
            GOLANG_IMAGE=golang:1.27.2-bookworm@sha256:5cf287a799e6b94384bad13d16b14904c531f51ba65792237e122ce42b392f61
            NVIDIA_IMAGE=nvidia/cuda:13.4.2-cudnn-devel-ubi8@sha256:7bf81df28de77ac76b1415edfa506645118fd72546842c58b50e544a28d69ec2
            DEST_DIR=/usr/local
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ needs.get_info.outputs.version }}
          push: false
          load: true
          github-token: ${{ env.REGISTER_PASSWORD }}

      - name: List images
        run: |
          docker images

      - name: Save Docker image to image.tar
        run: |
          docker save ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ needs.get_info.outputs.version }} -o image.tar

      - name: Upload image.tar as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hami-image
          path: image.tar
          retention-days: 5
          if-no-files-found: error

  # packages tgz from /charts of original branch, deploy to /charts of target branch
  package_chart:
    runs-on: ubuntu-22.04
    needs: [ test, get_info ]
    if: needs.get_info.outputs.e2e_run == 'true' || github.ref == 'refs/heads/master'
    env:
      HELM_VERSION: v3.22.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Add HAMi DRA Helm repository
        run: |
          helm repo add hami-dra https://project-hami.github.io/HAMi-DRA/
          helm repo update hami-dra

      - name: Build helm dependencies
        run: |
          helm dependency build charts/hami

      - name: Lint helm chart
        run: |
          make lint_chart

      - name: Package Chart
        continue-on-error: false
        env:
          VERSION: ${{ needs.get_info.outputs.version }}
        run: |
          cd charts
          make clean
          make
          if ! ls *.tgz &>/dev/null ; then
            echo "failed to generate chart"
            exit 1
          fi
          cd ..
          mkdir -p tmp
          mv charts/*.tgz tmp

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chart_package_artifact
          path: tmp/*
          retention-days: 5
          if-no-files-found: error

  # execute a full e2e test when hami code merge
  e2e_test:
    uses: ./.github/workflows/call-e2e.yaml
    needs: [ package_chart, get_info, build ]
    if: needs.get_info.outputs.e2e_run == 'true' || (github.repository == 'Project-HAMi/HAMi' && github.ref == 'refs/heads/master')
    with:
      ref: ${{ needs.get_info.outputs.version }}
      type: "pullrequest"

  # execute MIG smoke test when hami code merge
  e2e_mig_test:
    uses: ./.github/workflows/call-e2e-mig.yaml
    needs: [ package_chart, get_info, build, e2e_test ]
    if: (needs.get_info.outputs.e2e_run == 'true' || (github.repository == 'Project-HAMi/HAMi' && github.ref == 'refs/heads/master')) && vars.ENABLE_MIG_E2E == 'true'
    with:
      ref: ${{ needs.get_info.outputs.version }}
      type: "smoke"
      deploy-type: "pullrequest"
