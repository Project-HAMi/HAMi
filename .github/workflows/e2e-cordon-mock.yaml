name: Device cordon e2e (no GPU)

env:
  KIND_VERSION: v0.33.0

on:
  pull_request:
    paths:
      - "pkg/device/common/**"
      - "pkg/device/nvidia/**"
      - "pkg/device/amd/**"
      - "pkg/scheduler/**"
      - "pkg/device/*.go"
      - "charts/**"
      - "test/e2e/cordon/**"
      - "test/utils/**"
      - "hack/e2e-nvidia-mock.sh"
      - "hack/e2e-amd-mock.sh"
      - ".github/workflows/e2e-cordon-mock.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nvidia-mock:
    name: cordon specs with fake NVIDIA GPUs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: install Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      - name: create a kind cluster with a worker
        run: |
          go install sigs.k8s.io/kind@${KIND_VERSION}
          cat <<YAML | "$(go env GOPATH)/bin/kind" create cluster --name hami-cordon-nvidia --config -
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
            - role: worker
          YAML

      - name: build the scheduler image from this branch
        run: |
          # The scheduler and webhook are plain Go, so the CUDA stages of docker/Dockerfile are not needed.
          docker build -f docker/Dockerfile.no-core-test --build-arg BASE_IMAGE=ubuntu:22.04 \
            --build-arg VERSION="$(tr -d '[:space:]' < VERSION)" -t hami:cordon-mock-base .
          printf 'FROM hami:cordon-mock-base\nENV PATH=/k8s-vgpu/bin:$PATH\n' | docker build -t hami:cordon-mock -

      - name: deploy HAMi from this branch
        run: |
          export PATH="$(go env GOPATH)/bin:${PATH}"
          IMG_NAME=hami IMG_TAG=cordon-mock hack/deploy-helm.sh local "${HOME}/.kube/config"

      - name: run the cordon specs against fake NVIDIA GPUs
        run: |
          hack/e2e-nvidia-mock.sh "${HOME}/.kube/config"

      - name: collect logs
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n hami-system logs -l app.kubernetes.io/component=hami-scheduler --all-containers --tail=300 || true

  amd-mock:
    name: cordon specs with fake AMD GPUs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: install Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      - name: create a kind cluster with a worker
        run: |
          go install sigs.k8s.io/kind@${KIND_VERSION}
          cat <<YAML | "$(go env GOPATH)/bin/kind" create cluster --name hami-cordon-amd --config -
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
            - role: worker
          YAML

      - name: build the scheduler image from this branch
        run: |
          # The scheduler and webhook are plain Go, so the CUDA stages of docker/Dockerfile are not needed.
          docker build -f docker/Dockerfile.no-core-test --build-arg BASE_IMAGE=ubuntu:22.04 \
            --build-arg VERSION="$(tr -d '[:space:]' < VERSION)" -t hami:cordon-mock-base .
          printf 'FROM hami:cordon-mock-base\nENV PATH=/k8s-vgpu/bin:$PATH\n' | docker build -t hami:cordon-mock -

      - name: deploy HAMi from this branch
        run: |
          export PATH="$(go env GOPATH)/bin:${PATH}"
          IMG_NAME=hami IMG_TAG=cordon-mock hack/deploy-helm.sh local "${HOME}/.kube/config"

      - name: run the cordon specs against fake AMD GPUs
        run: |
          GINKGO_TARGET=./test/e2e/cordon/ hack/e2e-amd-mock.sh "${HOME}/.kube/config"
        env:
          CORDON_E2E_VENDOR: amd

      - name: collect logs
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n hami-system logs -l app.kubernetes.io/component=hami-scheduler --all-containers --tail=300 || true
