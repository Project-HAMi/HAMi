# Reaching the fleet by hand, from a machine with no GPU and no NVIDIA driver.
#
# There is nothing to apply here. Set devices.remotegpu.sessionImage and the
# scheduler keeps a stub on every lupine server, named after its node. The stub
# is what you forward to, so nobody needs forwarding rights in the namespace
# running the servers themselves.
#
#   kubectl -n kube-system get pods -l hami.io/lupine-session
#   kubectl -n kube-system port-forward pod/lupine-session-<node> 14833:14833
#
# Then, locally:
#
#   export LUPINE_SERVER=127.0.0.1:14833
#   LD_LIBRARY_PATH=/opt/lupine/lib nvidia-smi
#
# The forwarded port is the one that server listens on, which is the value of
# its hami.io/lupine-server label when it carries one.
#
# A session is not accounted for. The stub holds no card, because a lupine node
# reports no devices to the scheduler: it serves its GPUs rather than hosting
# pods that use them, so there is nothing there for a pod to be given. A session
# reaches whatever the server has, alongside whatever the scheduler has placed
# on it. Keep sessions to a fleet the scheduler is not offering when that
# matters.
#
# What the scheduler creates, for reference:
#
#   apiVersion: v1
#   kind: Pod
#   metadata:
#     name: lupine-session-<node>
#     namespace: <the scheduler's namespace>
#     labels:
#       hami.io/lupine-session: <node>
#   spec:
#     nodeName: <node>
#     tolerations:
#       - operator: Exists
#     containers:
#       - name: relay
#         image: <devices.remotegpu.sessionImage>
#         env:
#           - name: LUPINE_ENDPOINT
#             value: <node ip>:<port>
#         command: ["sh", "-c"]
#         args: ["exec socat TCP-LISTEN:<port>,fork,reuseaddr TCP:$LUPINE_ENDPOINT"]
