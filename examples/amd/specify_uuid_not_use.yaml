apiVersion: v1
kind: Pod
metadata:
  name: amd-gpu-uuid-not-use
  annotations:
    amd.com/nouse-gpu-uuid: "<GPU UUID>" # never run on these GPUs, comma separated
spec:
  containers:
    - name: rocm
      image: rocm/dev-ubuntu-24.04:7.2.4
      command: ["bash", "-c", "sleep infinity"]
      resources:
        limits:
          amd.com/gpu: 1
          amd.com/gpumem: 4096
