apiVersion: v1
kind: Pod
metadata:
  name: gpu-pod-prefer-4g
  annotations:
    nvidia.com/vgpu-mode: "mig"
    nvidia.com/mig-profile-preference: "4g"
spec:
  containers:
    - name: ubuntu-container
      image: ubuntu:18.04
      command: ["bash", "-c", "sleep 86400"]
      resources:
        limits:
          nvidia.com/gpu: 1
          nvidia.com/gpumem: 20000