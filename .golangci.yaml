version: "2"
run:
  concurrency: 4
  modules-download-mode: readonly
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
      colors: true
linters:
  default: none
  enable:
    - asciicheck
    - depguard
    - exptostd
    - forcetypeassert
    - godot
    - govet
    - intrange
    - iotamixing
    - misspell
    - modernize
    - nilnesserr
    - recvcheck
    - staticcheck
    - testifylint
    - unconvert
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/pkg/errors
              desc: use standard library errors or k8s.io/klog/v2
    godot:
      scope: declarations
      capital: false
    modernize:
      disable:
        - embedlit
        - omitzero
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - pkg/device-plugin
issues:
  uniq-by-line: true
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/Project-HAMi/HAMi
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
