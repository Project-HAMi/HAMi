header:
  schema-version: 2.0.0
  last-updated: '2026-11-16'
  last-reviewed: '2026-07-22'
  url: https://github.com/Project-HAMi/HAMi/blob/master/SECURITY-INSIGHTS.yml
  comment: |
    Security metadata for the HAMi project, following the OpenSSF
    Security Insights specification.

project:
  name: HAMi
  homepage: https://project-hami.io
  documentation:
    code-of-conduct: https://github.com/Project-HAMi/HAMi/blob/master/CODE_OF_CONDUCT.md
  administrators:
    - name: Li Mengxuan
      affiliation: dynamia.ai
      email: archlitchi@gmail.com
      primary: true
    - name: Xiao Zhang
      affiliation: dynamia.ai
      email: xiaozhang0210@hotmail.com
      primary: false
  repositories:
    - name: HAMi
      url: https://github.com/Project-HAMi/HAMi
      comment: |
        Main repository, heterogeneous AI computing virtualization
        middleware for Kubernetes.
    - name: HAMi-core
      url: https://github.com/Project-HAMi/HAMi-core
      comment: |
        In-container GPU resource controller (libvgpu), compiled into
        HAMi release images via a git submodule.
    - name: HAMi-WebUI
      url: https://github.com/Project-HAMi/HAMi-WebUI
      comment: |
        Web dashboard for HAMi resource monitoring.
    - name: ascend-device-plugin
      url: https://github.com/Project-HAMi/ascend-device-plugin
      comment: |
        Device plugin for Huawei Ascend NPUs, deployed with HAMi.
    - name: volcano-vgpu-device-plugin
      url: https://github.com/Project-HAMi/volcano-vgpu-device-plugin
      comment: |
        vGPU device plugin variant for the Volcano scheduler.
    - name: mock-device-plugin
      url: https://github.com/Project-HAMi/mock-device-plugin
      comment: |
        Registers mock devices on nodes; its image is deployed by the
        HAMi Helm chart.
    - name: amd-device-plugin
      url: https://github.com/Project-HAMi/amd-device-plugin
      comment: |
        Device plugin for AMD GPUs with HAMi vGPU support.
    - name: amd-hami-core
      url: https://github.com/Project-HAMi/amd-hami-core
      comment: |
        In-container memory limiter for AMD GPU pods (libamvgpu.so),
        mounted by amd-device-plugin.
    - name: hami-vnpu-core
      url: https://github.com/Project-HAMi/hami-vnpu-core
      comment: |
        In-container resource controller for Ascend NPUs (libvnpu.so).
    - name: HAMi-DRA
      url: https://github.com/Project-HAMi/HAMi-DRA
      comment: |
        Mutating webhook that converts device resource requests to
        Dynamic Resource Allocation ResourceClaims.
    - name: website
      url: https://github.com/Project-HAMi/website
      comment: |
        Source for the project documentation site at project-hami.io.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    contact:
      name: HAMi maintainers
      primary: true
    security-policy: https://github.com/Project-HAMi/HAMi/blob/master/SECURITY.md
    comment: |
      Report vulnerabilities privately via GitHub Security Advisories:
      https://github.com/Project-HAMi/HAMi/security/advisories/new
      See SECURITY.md for the full policy, scope, and response process.

repository:
  url: https://github.com/Project-HAMi/HAMi
  status: active
  accepts-change-request: true
  accepts-automated-change-request: true
  bug-fixes-only: false
  no-third-party-packages: false
  core-team:
    - name: Li Mengxuan
      affiliation: dynamia.ai
      email: archlitchi@gmail.com
      primary: true
    - name: Xiao Zhang
      affiliation: dynamia.ai
      email: xiaozhang0210@hotmail.com
      primary: false
    - name: Wang Leibo
      affiliation: Nvidia
      email: wang.platform@gmail.com
      primary: false
    - name: Yin Yu
      affiliation: Independent Developer
      email: nimbus-nimo@proton.me
      primary: false
    - name: Shouren Yang
      affiliation: 4Paradigm
      email: yangshouren@gmail.com
      primary: false
  documentation:
    contributing-guide: https://github.com/Project-HAMi/HAMi/blob/master/CONTRIBUTING.md
    dependency-management-policy: https://github.com/Project-HAMi/HAMi/blob/master/DEPENDENCY.md
    security-policy: https://github.com/Project-HAMi/HAMi/blob/master/SECURITY.md
    governance: https://github.com/Project-HAMi/community/blob/main/governance.md
  license:
    url: https://github.com/Project-HAMi/HAMi/blob/master/LICENSE
    expression: Apache-2.0
  security:
    assessments:
      self:
        comment: |
          Dependencies are monitored with Dependabot and scanned in CI
          (CodeQL, image scanning, FOSSA license and dependency checks).
          Go toolchain and module updates are applied promptly when
          vulnerabilities are published.
    tools:
      - name: Dependabot
        type: SCA
        version: latest
        rulesets:
          - built-in
        integration:
          adhoc: false
          ci: true
          release: false
        results: {}
        comment: |
          Automated dependency update PRs for Go modules, Dockerfiles,
          GitHub Actions and the HAMi-core submodule.
      - name: CodeQL
        type: SAST
        version: latest
        rulesets:
          - built-in
        integration:
          adhoc: false
          ci: true
          release: false
        results: {}
        comment: |
          Static analysis on pull requests via GitHub Actions.
      - name: OpenSSF Scorecard
        type: SCA
        version: latest
        rulesets:
          - built-in
        integration:
          adhoc: false
          ci: true
          release: false
        results: {}
        comment: |
          Supply-chain checks on pushes to master, a weekly schedule and
          branch protection rule changes, with results published to
          scorecard.dev and uploaded to GitHub code scanning.
      - name: Trivy
        type: SCA
        version: latest
        rulesets:
          - built-in
        integration:
          adhoc: false
          ci: true
          release: false
        results: {}
        comment: |
          Nightly vulnerability scan of the built container images, with
          results uploaded to GitHub code scanning.
      - name: GitHub secret scanning
        type: secret-scanning
        version: latest
        rulesets:
          - built-in
        integration:
          adhoc: false
          ci: true
          release: false
        results: {}
        comment: |
          GitHub native secret scanning with push protection, enabled
          on the repository to detect supported secret patterns and
          block them from being pushed.
