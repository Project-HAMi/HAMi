{{- if and .Values.devices.remotegpu.enabled .Values.devices.remotegpu.server.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "hami-vgpu.fullname" . }}-lupine-server
  namespace: {{ include "hami-vgpu.namespace" . }}
  labels:
    app.kubernetes.io/component: hami-lupine-server
    {{- include "hami-vgpu.labels" . | nindent 4 }}
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if .Values.global.annotations }}
  annotations: {{ toYaml .Values.global.annotations | nindent 4}}
  {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: hami-lupine-server
      {{- include "hami-vgpu.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: hami-lupine-server
        hami.io/webhook: ignore
        {{- include "hami-vgpu.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "hami.remotegpu.server.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.devices.remotegpu.monitor.enabled }}
      serviceAccountName: {{ include "hami-vgpu.fullname" . }}-remote-monitor
      {{- end }}
      {{- if .Values.devices.remotegpu.server.runtimeClassName }}
      runtimeClassName: {{ .Values.devices.remotegpu.server.runtimeClassName }}
      {{- end }}
      priorityClassName: system-node-critical
      # The scheduler tells clients to connect to the node's InternalIP, so the
      # server has to be reachable there rather than on a pod IP.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              # An empty value, not Exists: the device plugin applies this
              # label when operatingmode is remote, and the value carries the
              # port the scheduler sends clients to. A DaemonSet listens on one
              # port everywhere. A node whose label names a port is one whose
              # server is run outside the chart, so the chart-managed server
              # stays off it rather than listening on defaultPort while clients
              # are told to dial the labelled one.
              - matchExpressions:
                  # hami.io/lupine-server is a protocol constant shared with
                  # pkg/device/remotegpu, not something to configure here.
                  - key: hami.io/lupine-server
                    operator: In
                    values:
                      - ""
      {{- with .Values.devices.remotegpu.server.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: lupine-server
          image: {{ include "common.images.image" (dict "imageRoot" .Values.devices.remotegpu.server.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.devices.remotegpu.server.image.pullPolicy }}
          ports:
            - name: lupine
              containerPort: {{ .Values.devices.remotegpu.defaultPort }}
              hostPort: {{ .Values.devices.remotegpu.defaultPort }}
          env:
            # The GPUs reach the container through the NVIDIA runtime rather
            # than a resource request: in remote mode the device plugin no
            # longer advertises them to kubelet, so there is nothing to request.
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          {{- with .Values.devices.remotegpu.server.securityContext }}
          securityContext: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.devices.remotegpu.server.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.devices.remotegpu.monitor.enabled }}
        - name: remote-gpu-monitor
          image: {{ include "hami.devicePlugin.monitor.image" . }}
          imagePullPolicy: {{ .Values.devicePlugin.monitor.image.pullPolicy }}
          command:
            - remoteGPUmonitor
            - --lupine-metrics-url=http://127.0.0.1:{{ .Values.devices.remotegpu.defaultPort }}/metrics
            - --metrics-bind-address=:{{ .Values.devices.remotegpu.monitor.port }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NVIDIA_VISIBLE_DEVICES
              value: void
          ports:
            - name: remote-metrics
              containerPort: {{ .Values.devices.remotegpu.monitor.port }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: remote-metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: remote-metrics
          {{- with .Values.devices.remotegpu.monitor.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
{{- end }}
