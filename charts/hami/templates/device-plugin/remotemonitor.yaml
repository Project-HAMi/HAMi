{{- if and .Values.devices.remotegpu.enabled .Values.devices.remotegpu.server.enabled .Values.devices.remotegpu.monitor.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hami-vgpu.fullname" . }}-remote-monitor
  namespace: {{ include "hami-vgpu.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hami-vgpu.fullname" . }}-remote-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "hami-vgpu.fullname" . }}-remote-monitor
subjects:
  - kind: ServiceAccount
    name: {{ include "hami-vgpu.fullname" . }}-remote-monitor
    namespace: {{ include "hami-vgpu.namespace" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hami-vgpu.fullname" . }}-remote-monitor
  namespace: {{ include "hami-vgpu.namespace" . }}
  labels:
    app.kubernetes.io/component: hami-lupine-server
    {{- include "hami-vgpu.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: hami-lupine-server
    {{- include "hami-vgpu.selectorLabels" . | nindent 4 }}
  ports:
    - name: remote-metrics
      port: {{ .Values.devices.remotegpu.monitor.port }}
      targetPort: remote-metrics
      protocol: TCP
{{- if and (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor") .Values.prometheus.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "hami-vgpu.fullname" . }}-remote-monitor
  namespace: {{ include "hami-vgpu.namespace" . }}
  labels:
    {{- include "hami-vgpu.labels" . | nindent 4 }}
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: hami-lupine-server
      {{- include "hami-vgpu.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: remote-metrics
      path: /metrics
      honorLabels: true
{{- end }}
{{- end }}
