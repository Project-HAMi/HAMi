apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hami-vgpu.scheduler" . }}
  namespace: {{ include "hami-vgpu.namespace" . }}
  labels:
    app.kubernetes.io/component: "hami-scheduler"
    {{- include "hami-vgpu.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "list", "watch", "get", "update", "patch"]
{{- if .Values.devices.remotegpu.enabled }}
  # A Lupine server pod for each RemoteGPU client pod, and the optional session
  # relays. Namespaced rather than cluster wide: they live here and nowhere
  # else.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete"]
{{- end }}
