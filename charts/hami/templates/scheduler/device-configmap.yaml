apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hami-vgpu.scheduler" . }}-device
  namespace: {{ include "hami-vgpu.namespace" . }}
  labels:
    app.kubernetes.io/component: hami-scheduler
    {{- include "hami-vgpu.labels" . | nindent 4 }}
data:
  device-config.yaml: |-
  {{- if and (index .Values "device-config") (index .Values "device-config" "content") }}
  {{- (index .Values "device-config" "content") | nindent 4 }}
  {{- else if .Files.Glob "files/device-config.yaml" }}
  {{- .Files.Get "files/device-config.yaml" | nindent 4}}
  {{- else }}
    nvidia:
      resourceCountName: {{ .Values.resourceName }}
      resourceMemoryName: {{ .Values.resourceMem }}
      resourceMemoryPercentageName: {{ .Values.resourceMemPercentage }}
      resourceCoreName: {{ .Values.resourceCores }}
      resourcePriorityName: {{ .Values.resourcePriority }}
      overwriteEnv: {{ .Values.scheduler.overwriteEnv }}
      defaultMemory: {{ .Values.devices.nvidia.defaultMemory }}
      defaultCores: {{ .Values.devices.nvidia.defaultCores }}
      defaultGPUNum: {{ .Values.devices.nvidia.defaultGPUNum }}
      preConfiguredDeviceMemory: {{ .Values.devicePlugin.preConfiguredDeviceMemory }}
      memoryFactor: {{ .Values.devices.nvidia.memoryFactor }}
      deviceSplitCount: {{ .Values.devicePlugin.deviceSplitCount }}
      deviceMemoryScaling: {{ .Values.devicePlugin.deviceMemoryScaling }}
      deviceCoreScaling: {{ .Values.devicePlugin.deviceCoreScaling }}
      enableNumaTopology: {{ .Values.devicePlugin.enableNumaTopology }}
      gpuCorePolicy: {{ .Values.devices.nvidia.gpuCorePolicy }}
      libCudaLogLevel: {{ .Values.devices.nvidia.libCudaLogLevel }}
      runtimeClassName: "{{ .Values.devicePlugin.runtimeClassName }}"
      migProfileAllowlist: {{ toYaml .Values.devices.nvidia.migProfileAllowlist | nindent 8 }}
    cambricon:
      resourceCountName: {{ .Values.mluResourceName }}
      resourceMemoryName: {{ .Values.mluResourceMem }}
      resourceCoreName: {{ .Values.mluResourceCores }}
    hygon:
      resourceCountName: {{ .Values.hcuResourceName }}
      resourceMemoryName: {{ .Values.hcuResourceMem }}
      resourceCoreName: {{ .Values.hcuResourceCores }}
      memoryFactor: {{ .Values.devices.hygon.memoryFactor }}
    metax:
      resourceCountName: {{ .Values.devices.metax.resourceCountName | quote }}
      resourceVCountName: {{ .Values.metaxResourceName }}
      resourceVMemoryName: {{ .Values.metaxResourceMem }}
      resourceVCoreName: {{ .Values.metaxResourceCore }}
      sgpuTopologyAware: {{ .Values.metaxsGPUTopologyAware }}
    enflame:
      resourceNameGCU: {{ .Values.devices.enflame.resourceNameGCU | quote }}
      resourceNameDRSGCU: {{ .Values.enflameResourceNameDRSGCU }}
      resourceNameGCUMemory: {{ .Values.enflameResourceNameGCUMemory }}
      resourceNameGCUCore: {{ .Values.enflameResourceNameGCUCore }}
    mthreads:
      resourceCountName: {{ .Values.devices.mthreads.resourceCountName | quote }}
      resourceMemoryName: {{ .Values.devices.mthreads.resourceMemoryName | quote }}
      resourceCoreName: {{ .Values.devices.mthreads.resourceCoreName | quote }}
    iluvatars: {{ toYaml .Values.devices.iluvatar.configs | nindent 6 }}
    {{- if .Values.devices.remotegpu.enabled }}
    remotegpu:
      resourceCountName: {{ .Values.devices.remotegpu.resourceCountName }}
      resourceMemoryName: {{ .Values.devices.remotegpu.resourceMemoryName }}
      defaultPort: {{ .Values.devices.remotegpu.defaultPort }}
    {{- end }}
    kunlun:
      resourceCountName: {{ .Values.kunlunResourceName }}
      resourceVCountName: {{ .Values.kunlunResourceVCountName }}
      resourceVMemoryName: {{ .Values.kunlunResourceVMemoryName }}
    awsneuron:
      resourceCountName: {{ .Values.devices.awsneuron.resourceCountName | quote }}
      resourceCoreName: {{ .Values.devices.awsneuron.resourceCoreName | quote }}
    amd:
      resourceCountName: {{ .Values.devices.amd.resourceCountName | quote }}
      resourceCoreName: {{ .Values.devices.amd.resourceCoreName | quote }}
      resourceMemoryName: {{ .Values.devices.amd.resourceMemoryName | quote }}
    vastai:
      resourceCountName: {{ .Values.vastaiResourceName }}
    biren:
      resourceCountName: {{ .Values.birenResourceName }}
    vnpus:
      hamiVnpuCore: {{ .Values.devices.ascend.hamiVnpuCore }}
      overwriteEnv: {{ .Values.scheduler.overwriteEnv }}
      runtimeClassName: "{{ .Values.devices.ascend.runtimeClassName }}"
      configs: {{ toYaml .Values.devices.ascend.configs | nindent 8 }}
  {{ end }}
