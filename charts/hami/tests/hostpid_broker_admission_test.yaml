---
suite: Host PID broker admission
templates:
  - device-plugin/daemonsetnvidia.yaml
  - scheduler/configmap.yaml
  - scheduler/device-configmap.yaml
  - validate-values.yaml
capabilities:
  majorVersion: 1
  minorVersion: 31
tests:
  - it: leaves the broker environment unset by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: LIBVGPU_HOSTPID_BROKER
        template: device-plugin/daemonsetnvidia.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: HAMI_HOSTPID_DRIVER_ADMISSION_PERMITS
        template: device-plugin/daemonsetnvidia.yaml

  - it: passes the permit count when the broker is enabled
    set:
      devicePlugin.hostPIDBroker.enabled: true
      devicePlugin.hostPIDBroker.driverAdmissionPermits: 4
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: LIBVGPU_HOSTPID_BROKER
            value: "1"
        template: device-plugin/daemonsetnvidia.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: HAMI_HOSTPID_DRIVER_ADMISSION_PERMITS
            value: "4"
        template: device-plugin/daemonsetnvidia.yaml

  - it: accepts a quoted permit count
    set:
      devicePlugin.hostPIDBroker.enabled: true
      devicePlugin.hostPIDBroker.driverAdmissionPermits: "2"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: HAMI_HOSTPID_DRIVER_ADMISSION_PERMITS
            value: "2"
        template: device-plugin/daemonsetnvidia.yaml

  - it: rejects a single permit
    set:
      devicePlugin.hostPIDBroker.driverAdmissionPermits: 1
    asserts:
      - failedTemplate:
          errorMessage: devicePlugin.hostPIDBroker.driverAdmissionPermits must be 0 or an integer from 2 through 64
    template: validate-values.yaml

  - it: rejects a permit count above the maximum
    set:
      devicePlugin.hostPIDBroker.driverAdmissionPermits: 65
    asserts:
      - failedTemplate:
          errorMessage: devicePlugin.hostPIDBroker.driverAdmissionPermits must be 0 or an integer from 2 through 64
    template: validate-values.yaml

  - it: rejects a non-numeric permit count
    set:
      devicePlugin.hostPIDBroker.driverAdmissionPermits: four
    asserts:
      - failedTemplate:
          errorMessage: devicePlugin.hostPIDBroker.driverAdmissionPermits must be 0 or an integer from 2 through 64
    template: validate-values.yaml

  - it: rejects a fractional permit count
    set:
      devicePlugin.hostPIDBroker.driverAdmissionPermits: 2.5
    asserts:
      - failedTemplate:
          errorMessage: devicePlugin.hostPIDBroker.driverAdmissionPermits must be 0 or an integer from 2 through 64
    template: validate-values.yaml
