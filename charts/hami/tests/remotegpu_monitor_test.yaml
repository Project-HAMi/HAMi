suite: Remote GPU monitor deployment
templates:
  - device-plugin/daemonsetremotemonitor.yaml
  - device-plugin/daemonsetnvidia.yaml
  - scheduler/configmap.yaml
  - scheduler/device-configmap.yaml
set:
  devices.remotegpu.enabled: true
tests:
  - it: runs no monitor by default
    template: device-plugin/daemonsetremotemonitor.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: gives the monitor its own token and a memory limit
    template: device-plugin/daemonsetremotemonitor.yaml
    set:
      devices.remotegpu.monitor.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.containers[0].name
          value: remote-gpu-monitor
      - notExists:
          path: spec.template.spec.containers[1]
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /var/run/secrets/kubernetes.io/serviceaccount
      - equal:
          path: spec.template.spec.volumes[0].name
          value: remote-monitor-kube-api
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 50m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 64Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 256Mi
  # Every lupine node runs client pods' servers, whatever port its label names.
  - it: runs the monitor on every lupine node, on the node's network
    template: device-plugin/daemonsetremotemonitor.yaml
    set:
      devices.remotegpu.monitor.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.hostNetwork
          value: true
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0]
          value:
            key: hami.io/lupine-server
            operator: Exists
  - it: keeps the device plugin pod when the remote monitor is enabled
    template: device-plugin/daemonsetnvidia.yaml
    set:
      devices.remotegpu.monitor.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.affinity
  - it: keeps vGPUmonitor on lupine nodes when the remote monitor is disabled
    template: device-plugin/daemonsetnvidia.yaml
    asserts:
      - notExists:
          path: spec.template.spec.affinity
