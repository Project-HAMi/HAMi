suite: Google TPU extender resources
templates:
  - scheduler/configmap.yaml
  - scheduler/device-configmap.yaml
tests:
  - it: leaves the node capacity check for TPU chips to kube-scheduler
    templates:
      - scheduler/configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: '(?m)^\s*- ignoredByScheduler: false\n\s+name: google\.com/tpu\s*$'
  - it: treats a renamed resource and custom resources the same way
    templates:
      - scheduler/configmap.yaml
    set:
      devices.googletpu.resourceCountName: example.com/tpu
      devices.googletpu.customresources:
        - example.com/tpu-extra
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: '(?m)^\s*- ignoredByScheduler: false\n\s+name: example\.com/tpu\s*$'
      - matchRegex:
          path: data["config.yaml"]
          pattern: '(?m)^\s*- ignoredByScheduler: false\n\s+name: example\.com/tpu-extra\s*$'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'google\.com/tpu'
  - it: leaves the resource out of the extender when disabled
    templates:
      - scheduler/configmap.yaml
    set:
      devices.googletpu.enabled: false
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'google\.com/tpu'
  - it: renders the device configuration only when enabled
    templates:
      - scheduler/device-configmap.yaml
    asserts:
      - matchRegex:
          path: data["device-config.yaml"]
          pattern: '(?m)^googletpu:\n\s+resourceCountName: google\.com/tpu$'
  - it: leaves TPU Pods to GKE when disabled
    templates:
      - scheduler/device-configmap.yaml
    set:
      devices.googletpu.enabled: false
    asserts:
      - notMatchRegex:
          path: data["device-config.yaml"]
          pattern: googletpu
