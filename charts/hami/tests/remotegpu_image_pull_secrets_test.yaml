suite: RemoteGPU image pull secrets
templates:
  - device-plugin/daemonsetlupine.yaml
  - scheduler/device-configmap.yaml
  - scheduler/deployment.yaml
  - scheduler/configmap.yaml
  - device-plugin/daemonsetnvidia.yaml
capabilities:
  majorVersion: 1
  minorVersion: 31
set:
  devices.remotegpu.enabled: true
tests:
  - it: omits pull secrets by default
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets
        template: device-plugin/daemonsetlupine.yaml
      - notMatchRegex:
          path: data["device-config.yaml"]
          pattern: 'sessionImagePullSecrets:'
        template: scheduler/device-configmap.yaml

  - it: applies global pull secrets to server and session pods
    set:
      global.imagePullSecrets:
        - global-registry
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: global-registry
        template: device-plugin/daemonsetlupine.yaml
      - matchRegex:
          path: data["device-config.yaml"]
          pattern: 'sessionImagePullSecrets:\n    - global-registry\n'
        template: scheduler/device-configmap.yaml

  - it: applies only server-specific pull secrets to the server pods
    set:
      devices.remotegpu.server.image.pullSecrets:
        - server-registry
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: server-registry
        template: device-plugin/daemonsetlupine.yaml
      - notMatchRegex:
          path: data["device-config.yaml"]
          pattern: 'sessionImagePullSecrets:'
        template: scheduler/device-configmap.yaml

  - it: applies only session-specific pull secrets to the scheduler config
    set:
      devices.remotegpu.sessionImagePullSecrets:
        - session-registry
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets
        template: device-plugin/daemonsetlupine.yaml
      - matchRegex:
          path: data["device-config.yaml"]
          pattern: 'sessionImagePullSecrets:\n    - session-registry\n'
        template: scheduler/device-configmap.yaml

  - it: appends component pull secrets after global pull secrets
    set:
      global.imagePullSecrets:
        - global-registry
      devices.remotegpu.server.image.pullSecrets:
        - server-registry
      devices.remotegpu.sessionImagePullSecrets:
        - session-registry
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: global-registry
            - name: server-registry
        template: device-plugin/daemonsetlupine.yaml
      - matchRegex:
          path: data["device-config.yaml"]
          pattern: 'sessionImagePullSecrets:\n    - global-registry\n    - session-registry\n'
        template: scheduler/device-configmap.yaml

  - it: treats explicitly empty pull secret lists like defaults
    set:
      global.imagePullSecrets: []
      devices.remotegpu.server.image.pullSecrets: []
      devices.remotegpu.sessionImagePullSecrets: []
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets
        template: device-plugin/daemonsetlupine.yaml
      - notMatchRegex:
          path: data["device-config.yaml"]
          pattern: 'sessionImagePullSecrets:'
        template: scheduler/device-configmap.yaml

  - it: does not leak RemoteGPU-specific secrets into existing pods
    set:
      global.imagePullSecrets:
        - global-registry
      scheduler.extender.image.pullSecrets:
        - scheduler-registry
      devicePlugin.image.pullSecrets:
        - device-plugin-registry
      devices.remotegpu.server.image.pullSecrets:
        - server-registry
      devices.remotegpu.sessionImagePullSecrets:
        - session-registry
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: global-registry
            - name: scheduler-registry
        template: scheduler/deployment.yaml
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: global-registry
            - name: device-plugin-registry
        template: device-plugin/daemonsetnvidia.yaml
