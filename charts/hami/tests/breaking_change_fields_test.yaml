- it: renders all migrated NVIDIA device plugin settings and creates the runtime class
  set:
    devices.nvidia.deviceSplitCount: 20
    devices.nvidia.deviceMemoryScaling: 1.5
    devices.nvidia.deviceCoreScaling: 2
    devices.nvidia.preConfiguredDeviceMemory: 4096
    devices.nvidia.enableNumaTopology: true
    devices.nvidia.runtimeClassName: custom-nvidia
    devices.nvidia.createRuntimeClass: true
  asserts:
  - matchRegex:
      path: data["device-config.yaml"]
      pattern: "(?m)^  deviceSplitCount: 20$"
    template: scheduler/device-configmap.yaml
  - matchRegex:
      path: data["device-config.yaml"]
      pattern: "(?m)^  deviceMemoryScaling: 1\\.5$"
    template: scheduler/device-configmap.yaml
  - matchRegex:
      path: data["device-config.yaml"]
      pattern: "(?m)^  deviceCoreScaling: 2$"
    template: scheduler/device-configmap.yaml
  - matchRegex:
      path: data["device-config.yaml"]
      pattern: "(?m)^  preConfiguredDeviceMemory: 4096$"
    template: scheduler/device-configmap.yaml
  - matchRegex:
      path: data["device-config.yaml"]
      pattern: "(?m)^  enableNumaTopology: true$"
    template: scheduler/device-configmap.yaml
  - matchRegex:
      path: data["device-config.yaml"]
      pattern: '(?m)^  runtimeClassName: "custom-nvidia"$'
    template: scheduler/device-configmap.yaml
  - equal:
      path: spec.template.spec.runtimeClassName
      value: custom-nvidia
    template: device-plugin/daemonsetnvidia.yaml
  - equal:
      path: metadata.name
      value: custom-nvidia
    template: device-plugin/runtime-class.yaml
  - equal:
      path: handler
      value: nvidia
    template: device-plugin/runtime-class.yaml
