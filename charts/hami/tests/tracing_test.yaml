suite: Tracing environment
templates:
  - scheduler/deployment.yaml
  - scheduler/configmap.yaml
  - scheduler/device-configmap.yaml
  - device-plugin/daemonsetnvidia.yaml
  - validate-values.yaml
capabilities:
  majorVersion: 1
  minorVersion: 31
tests:
  - it: leaves the OTEL environment unset by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[1].env
          any: true
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
        template: scheduler/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
        template: device-plugin/daemonsetnvidia.yaml

  - it: passes the endpoint and extra variables to the extender and the device plugin
    set:
      tracing.otlpEndpoint: http://jaeger.tracing:4317
      tracing.extraEnvs:
        - name: OTEL_TRACES_SAMPLER_ARG
          value: "0.1"
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: otel-auth
              key: headers
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://jaeger.tracing:4317
        template: scheduler/deployment.yaml
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: OTEL_TRACES_SAMPLER_ARG
            value: "0.1"
        template: scheduler/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://jaeger.tracing:4317
        template: device-plugin/daemonsetnvidia.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_TRACES_SAMPLER_ARG
            value: "0.1"
        template: device-plugin/daemonsetnvidia.yaml
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: OTEL_EXPORTER_OTLP_HEADERS
            valueFrom:
              secretKeyRef:
                name: otel-auth
                key: headers
        template: scheduler/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_HEADERS
            valueFrom:
              secretKeyRef:
                name: otel-auth
                key: headers
        template: device-plugin/daemonsetnvidia.yaml
      - notContains:
          path: spec.template.spec.containers[1].env
          any: true
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
        template: device-plugin/daemonsetnvidia.yaml

  - it: passes extra variables when they set the traces endpoint
    set:
      tracing.extraEnvs:
        - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: http://jaeger.tracing:4317
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
            value: http://jaeger.tracing:4317
        template: scheduler/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
            value: http://jaeger.tracing:4317
        template: device-plugin/daemonsetnvidia.yaml
      - notContains:
          path: spec.template.spec.containers[1].env
          any: true
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
        template: scheduler/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
        template: device-plugin/daemonsetnvidia.yaml

  - it: passes extra variables when they set the general endpoint
    set:
      tracing.extraEnvs:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://jaeger.tracing:4317
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://jaeger.tracing:4317
        template: scheduler/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://jaeger.tracing:4317
        template: device-plugin/daemonsetnvidia.yaml

  - it: skips otlpEndpoint when extra variables set the general endpoint
    set:
      tracing.otlpEndpoint: http://jaeger.tracing:4317
      tracing.extraEnvs:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-agent.tracing:4317
    asserts:
      - notContains:
          path: spec.template.spec.containers[1].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://jaeger.tracing:4317
        template: scheduler/deployment.yaml
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://otel-agent.tracing:4317
        template: scheduler/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://jaeger.tracing:4317
        template: device-plugin/daemonsetnvidia.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://otel-agent.tracing:4317
        template: device-plugin/daemonsetnvidia.yaml

  - it: ignores extra variables without an endpoint
    set:
      tracing.extraEnvs:
        - name: OTEL_TRACES_SAMPLER
          value: parentbased_traceidratio
    asserts:
      - notContains:
          path: spec.template.spec.containers[1].env
          any: true
          content:
            name: OTEL_TRACES_SAMPLER
        template: scheduler/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: OTEL_TRACES_SAMPLER
        template: device-plugin/daemonsetnvidia.yaml

  - it: skips tracing variables already set in devicePlugin.extraEnvs
    set:
      tracing.otlpEndpoint: http://jaeger.tracing:4317
      tracing.extraEnvs:
        - name: OTEL_TRACES_SAMPLER_ARG
          value: "0.1"
      devicePlugin.extraEnvs:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-agent.tracing:4317
        - name: OTEL_TRACES_SAMPLER_ARG
          value: "0.5"
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://jaeger.tracing:4317
        template: device-plugin/daemonsetnvidia.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_TRACES_SAMPLER_ARG
            value: "0.1"
        template: device-plugin/daemonsetnvidia.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_TRACES_SAMPLER_ARG
            value: "0.5"
        template: device-plugin/daemonsetnvidia.yaml
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: OTEL_TRACES_SAMPLER_ARG
            value: "0.1"
        template: scheduler/deployment.yaml

  - it: rejects an otlpEndpoint without http:// or https://
    set:
      tracing.otlpEndpoint: jaeger.tracing:4317
    asserts:
      - failedTemplate:
          errorMessage: tracing.otlpEndpoint must start with http:// or https://
    template: validate-values.yaml

  - it: rejects an endpoint in extraEnvs without http:// or https://
    set:
      tracing.extraEnvs:
        - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: jaeger.tracing:4317
    asserts:
      - failedTemplate:
          errorMessage: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT in tracing.extraEnvs must start with http:// or https://
    template: validate-values.yaml

  - it: does not check an endpoint read from a Secret
    set:
      tracing.extraEnvs:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: otel-endpoint
              key: url
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: otel-endpoint
                key: url
        template: scheduler/deployment.yaml
