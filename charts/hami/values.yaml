## @section Global configuration
global:
  # global.imageRegistry -- Registry override applied to component image definitions.
  imageRegistry: ""
  ## E.g.
  ## imagePullSecrets:
  ##   - myRegistryKeySecretName

  # global.imagePullSecrets -- Global Docker image pull secrets
  imagePullSecrets: []
  # global.imageTag -- Fallback HAMi image tag when a component tag is empty.
  imageTag: "v2.10.0"
  # global.gpuHookPath -- Host directory under which HAMi installs its vgpu hook files.
  gpuHookPath: /usr/local
  # global.labels -- Additional labels on chart-managed resources.
  labels: {}
  # global.annotations -- Additional annotations on chart-managed resources.
  annotations: {}
  # global.managedNodeSelectorEnable -- Inject global.managedNodeSelector into Pods handled by the admission webhook.
  managedNodeSelectorEnable: false
  managedNodeSelector:
    # global.managedNodeSelector.usage -- Value of the usage node label injected when the managed node selector is enabled.
    usage: "gpu"

# nameOverride -- Override the chart name used in resource names and labels.
nameOverride: ""
# fullnameOverride -- Override the complete release resource-name prefix.
fullnameOverride: ""
# namespaceOverride -- Override the namespace used for chart-managed namespaced resources.
namespaceOverride: ""

platform:
  # platform.openshift -- Render OpenShift security constraints and platform-specific device-plugin settings.
  openshift: false

openshift:
  securityContextConstraints:
    # openshift.securityContextConstraints.create -- Create the named device-plugin SCC and its use ClusterRole when OpenShift support is enabled. Set this to false only when both the SCC and `system:openshift:scc:<name>` ClusterRole already exist, such as for the built-in `privileged` SCC.
    create: true

    # openshift.securityContextConstraints.name -- SCC granted to enabled device-plugin service accounts. When `create=false`, the matching `system:openshift:scc:<name>` ClusterRole must already exist. The built-in `privileged` SCC requires `create=false`.
    name: "hami-device-plugin"

# SELinux relabeling is available on any SELinux-enabled Kubernetes distribution.
selinux:
  # selinux.enabled -- Relabel shared host vGPU directories for SELinux-enabled nodes.
  enabled: false
  # selinux.type -- SELinux type applied to shared host vGPU directories.
  type: container_file_t
  # selinux.level -- SELinux level applied to shared host vGPU directories.
  level: s0

# schedulerName -- Scheduler name assigned to Pods handled by HAMi.
schedulerName: "hami-scheduler"

podSecurityPolicy:
  # podSecurityPolicy.enabled -- Create PodSecurityPolicy resources on Kubernetes versions that support them.
  enabled: false

scheduler:
  # if we install the nvidia-vgpu-scheduler-scheduler as default scheduler, we need to remove the k8s default
  # scheduler pod from the cluster first, we must specify node name to skip the schedule workflow.

  # scheduler.nodeName -- Bind the scheduler Pod to this node; empty leaves node selection to Kubernetes.
  nodeName: ""
  #nodeLabelSelector:
  #  "gpu": "on"
  # scheduler.overwriteEnv -- Inject NVIDIA_VISIBLE_DEVICES=none or an empty ASCEND_VISIBLE_DEVICES into containers that do not request the corresponding device resources. Pod and container annotations can override this default.
  overwriteEnv: "false"
  defaultSchedulerPolicy:
    # scheduler.defaultSchedulerPolicy.nodeSchedulerPolicy -- Node scheduler policy
    nodeSchedulerPolicy: binpack
    # scheduler.defaultSchedulerPolicy.gpuSchedulerPolicy -- GPU scheduler policy
    gpuSchedulerPolicy: spread
  # scheduler.metricsBindAddress -- Listen address for scheduler Prometheus metrics.
  metricsBindAddress: ":9395"
  # Only used when --profiling is enabled in scheduler.extender.extraArgs.
  # Keep loopback binding and use kubectl port-forward to access pprof.

  # scheduler.profilingBindAddress -- Dedicated pprof HTTP bind address; only used when profiling is enabled. Keep loopback binding and use kubectl port-forward for access.
  profilingBindAddress: "127.0.0.1:6060"
  # Client-side rate limiting and timeout for the scheduler's connection to the kube-apiserver.
  # Leave empty to keep the binary defaults (QPS 5, burst 10, no timeout). Raising kubeQPS and
  # kubeBurst helps on large clusters, where node registration patches and per-pod annotation
  # writes can be throttled by the default limits.

  # scheduler.kubeQPS -- Client QPS for kube-apiserver requests; empty keeps the binary default of 5.
  kubeQPS: ""
  # scheduler.kubeBurst -- Client burst for kube-apiserver requests; empty keeps the binary default of 10.
  kubeBurst: ""
  # kubeTimeout is in seconds; 0 means no timeout.

  # scheduler.kubeTimeout -- Timeout in seconds for kube-apiserver requests; empty keeps the binary default and 0 means no timeout.
  kubeTimeout: ""
  # How long Bind retries LockNode when another PodGroup member holds the node
  # lock. Empty keeps the binary default (28s); 0 disables retry entirely.

  # scheduler.nodeLockRetryTimeout -- Maximum time Bind retries a node allocation lock. Empty keeps the binary default of 28s; 0 disables retry.
  nodeLockRetryTimeout: ""
  # httpTimeout the generated scheduler configuration gives the HAMi extender, in
  # seconds. It is applied to the KubeSchedulerConfiguration used on Kubernetes
  # 1.22+ and to the legacy Policy format used below it, which is why it is
  # expressed in seconds rather than as a duration: the two formats want
  # different units. Keep it above nodeLockRetryTimeout, otherwise kube-scheduler
  # cuts the bind call off while the extender is still retrying the node lock.

  # scheduler.extenderHTTPTimeout -- `httpTimeout` given to the HAMi extender in the generated scheduler configuration, in seconds. Applies to both the KubeSchedulerConfiguration used on Kubernetes 1.22+ and the legacy Policy format used below it. Keep it above `scheduler.nodeLockRetryTimeout`
  extenderHTTPTimeout: 30
  # Port the extender serves /filter and /bind on, bound to 127.0.0.1 so only
  # the kube-scheduler container sharing this pod's network namespace can call
  # them. It is deliberately not the port the Service publishes: that one also
  # carries /webhook and /refit, which must stay reachable from the cluster,
  # and /filter and /bind have no caller authentication of their own. Change
  # this only if 9444 is already taken inside the pod; if you run kube-scheduler
  # outside this pod, override the bind address through
  # scheduler.extender.extraArgs instead.

  # scheduler.extenderPort -- Loopback port for the extender filter and bind endpoints inside the scheduler Pod.
  extenderPort: 9444
  # If set to false, When Pod.Spec.SchedulerName equals to the const DefaultSchedulerName in k8s.io/api/core/v1 package, webhook will not overwrite it

  # scheduler.forceOverwriteDefaultScheduler -- Replace the default Kubernetes scheduler name on matching Pods with schedulerName.
  forceOverwriteDefaultScheduler: true
  # scheduler.livenessProbe -- Enable the scheduler liveness probe.
  livenessProbe: false
  # scheduler.leaderElect -- Enable scheduler leader election.
  leaderElect: true
  # when leaderElect is true, replicas is available, otherwise replicas is 1.

  # scheduler.replicas -- Scheduler replica count when leader election is enabled; otherwise the chart uses one replica.
  replicas: 1
  # podDisruptionBudget only renders when leaderElect is true and replicas > 1;
  # with a single replica it would block all voluntary node drains.
  podDisruptionBudget:
    # scheduler.podDisruptionBudget.minAvailable -- Minimum number of available scheduler pods during voluntary disruptions (only rendered when `scheduler.leaderElect` is `true` and `scheduler.replicas` is greater than `1`)
    minAvailable: 1
    # maxUnavailable: 1
  kubeScheduler:
    # scheduler.kubeScheduler.enabled -- Whether to run kube-scheduler container in scheduler pod
    enabled: true
    image:
      # scheduler.kubeScheduler.image.registry -- Container image registry; global.imageRegistry takes priority when set.
      registry: "registry.cn-hangzhou.aliyuncs.com"
      # scheduler.kubeScheduler.image.repository -- Container image repository name.
      repository: "google_containers/kube-scheduler"
      # scheduler.kubeScheduler.image.tag -- Kube-scheduler image tag; empty derives the tag from the target Kubernetes version.
      tag: ""
      ## Specify a imagePullPolicy
      ## Defaults to 'Always' if image tag is 'latest', else set to 'IfNotPresent'
      ## ref: https://kubernetes.io/docs/user-guide/images/#pre-pulling-images
      ##

      # scheduler.kubeScheduler.image.pullPolicy -- Kubernetes container image pull policy.
      pullPolicy: IfNotPresent
      ## Optionally specify an array of imagePullSecrets.
      ## Secrets must be manually created in the namespace.
      ## Example:
      ## pullSecrets:
      ##   - myRegistryKeySecretName
      ##

      # scheduler.kubeScheduler.image.pullSecrets -- Names of existing image-pull Secrets for the component images.
      pullSecrets: []
    # scheduler.kubeScheduler.resources -- Kubernetes CPU and memory requests and limits for the container.
    resources: {}
      # If you do want to specify resources, uncomment the following lines, adjust them as necessary.
      # and remove the curly braces after 'resources:'.
#      limits:
#        cpu: 1000m
#        memory: 1000Mi
#      requests:
#        cpu: 100m
#        memory: 100Mi

    # scheduler.kubeScheduler.extraNewArgs -- Kube-scheduler arguments for Kubernetes 1.22 and newer.
    extraNewArgs:
      - --config=/config/config.yaml
      - -v=4
    # scheduler.kubeScheduler.extraArgs -- Kube-scheduler arguments for the legacy Policy configuration on Kubernetes before 1.22.
    extraArgs:
      - --policy-config-file=/config/config.json
      - -v=4
  extender:
    image:
      # scheduler.extender.image.registry -- Container image registry; global.imageRegistry takes priority when set.
      registry: "docker.io"
      # scheduler.extender.image.repository -- Container image repository name.
      repository: "projecthami/hami"
      # scheduler.extender.image.tag -- Container image tag; an empty tag uses global.imageTag.
      tag: ""
      ## Specify a imagePullPolicy
      ## Defaults to 'Always' if image tag is 'latest', else set to 'IfNotPresent'
      ## ref: https://kubernetes.io/docs/user-guide/images/#pre-pulling-images
      ##

      # scheduler.extender.image.pullPolicy -- Kubernetes container image pull policy.
      pullPolicy: IfNotPresent
      ## Optionally specify an array of imagePullSecrets.
      ## Secrets must be manually created in the namespace.
      ## Example:
      ## pullSecrets:
      ##   - myRegistryKeySecretName
      ##

      # scheduler.extender.image.pullSecrets -- Names of existing image-pull Secrets for the component images.
      pullSecrets: []
    # scheduler.extender.resources -- Kubernetes CPU and memory requests and limits for the container.
    resources: {}
      # If you do want to specify resources, uncomment the following lines, adjust them as necessary,
      # and remove the curly braces after 'resources:'.
#      limits:
#        cpu: 1000m
#        memory: 1000Mi
#      requests:
#        cpu: 100m
#        memory: 100Mi

    # scheduler.extender.extraArgs -- Scheduler extender extra arguments
    extraArgs:
      - --debug
      - -v=4
  # scheduler.nodeLockExpire -- Duration after which a stale node allocation lock may be reclaimed.
  nodeLockExpire: "5m"
  # scheduler.podAnnotations -- Additional annotations on the Pod template.
  podAnnotations: {}
  # scheduler.tolerations -- Kubernetes Pod tolerations for node taints.
  tolerations: []
  #serviceAccountName: "hami-vgpu-scheduler-sa"
  admissionWebhook:
    # If set to false, the admission webhook is not installed and any pods that should use HAMi must be
    # configured to use the right 'schedulerName' and other device-specific configurations.

    # scheduler.admissionWebhook.enabled -- Whether to enable admission webhook
    enabled: true
    customURL:
      # scheduler.admissionWebhook.customURL.enabled -- Whether to enable custom URL
      enabled: false
      # must be an endpoint using https.
      # should generate host certs here

      # scheduler.admissionWebhook.customURL.host -- Custom URL host
      host: 127.0.0.1 # hostname or ip, can be your node'IP if you want to use https://<nodeIP>:<schedulerPort>/<path>
      # scheduler.admissionWebhook.customURL.port -- Custom URL port
      port: 31998
      # scheduler.admissionWebhook.customURL.path -- Custom URL path
      path: /webhook
    # scheduler.admissionWebhook.whitelistNamespaces -- (list) Namespace names excluded from HAMi admission webhook matching.
    whitelistNamespaces:
    # Specify the namespaces that the webhook will not be applied to.
      # - default
      # - kube-system
      # - istio-system
    # manageNamespaceSelector controls whether the chart renders and manages the webhook's
    # namespaceSelector field. Keep it true on standard Kubernetes clusters.
    # Set it to false on managed platforms (e.g. AKS) where the platform mutates and owns
    # the namespaceSelector field, to avoid server-side apply ownership conflicts.

    # scheduler.admissionWebhook.manageNamespaceSelector -- Whether the chart renders and manages the webhook namespaceSelector field
    manageNamespaceSelector: true
    # namespaceSelector controls which namespaces the webhook will be applied to.
    # The default matchExpressions exclude namespaces with label "hami.io/webhook: ignore".
    # You can add additional matchLabels or matchExpressions to further filter namespaces.
    namespaceSelector:
      # scheduler.admissionWebhook.namespaceSelector.matchLabels -- (object) Namespace labels required for webhook matching when manageNamespaceSelector is enabled.
      matchLabels:
        # app.kubernetes.io/part-of: kubeflow-profile

      # scheduler.admissionWebhook.namespaceSelector.matchExpressions -- Namespace label expressions used for webhook matching; appended to the chart exclusions.
      matchExpressions: []
      # Example: exclude namespaces with specific labels
      # - key: environment
      #   operator: In
      #   values:
      #   - development
      #   - staging
    # objectSelector controls which pods the webhook will be applied to.
    # The default matchExpressions exclude pods with label "hami.io/webhook: ignore".
    # You can add additional matchLabels or matchExpressions to further filter pods.
    objectSelector:
      # matchLabels:
      #   app.kubernetes.io/managed-by: hami

      # scheduler.admissionWebhook.objectSelector.matchExpressions -- Pod label expressions used for webhook matching; appended to the chart exclusions.
      matchExpressions: []
      # Example: only apply to pods with specific labels
      # - key: hami.io/enable
      #   operator: In
      #   values:
      #   - "true"

    # scheduler.admissionWebhook.reinvocationPolicy -- Kubernetes admission webhook reinvocation policy.
    reinvocationPolicy: Never
    # scheduler.admissionWebhook.failurePolicy -- Kubernetes admission webhook policy when the webhook call fails.
    failurePolicy: Ignore
  ## TLS Certificate Option 1: Use cert-manager to generate self-signed certificate.
  ## If enabled, always takes precedence over options 2.
  certManager:
    # scheduler.certManager.enabled -- Whether to use cert-manager to generate self-signed certificates
    enabled: false
  ## TLS Certificate Option 2: Use kube-webhook-certgen to generate self-signed certificate.
  ## If true and certManager.enabled is false, Helm will automatically create a self-signed cert and secret for you.
  patch:
    # scheduler.patch.enabled -- Whether to use kube-webhook-certgen to generate self-signed certificates
    enabled: true
    image:
      # scheduler.patch.image.registry -- Container image registry; global.imageRegistry takes priority when set.
      registry: "docker.io"
      # scheduler.patch.image.repository -- Container image repository name.
      repository: "jettech/kube-webhook-certgen"
      # scheduler.patch.image.tag -- Container image tag.
      tag: "v1.5.2"
      ## Specify a imagePullPolicy
      ## Defaults to 'Always' if image tag is 'latest', else set to 'IfNotPresent'
      ## ref: https://kubernetes.io/docs/user-guide/images/#pre-pulling-images
      ##

      # scheduler.patch.image.pullPolicy -- Kubernetes container image pull policy.
      pullPolicy: IfNotPresent
      ## Optionally specify an array of imagePullSecrets.
      ## Secrets must be manually created in the namespace.
      ## Example:
      ## pullSecrets:
      ##   - myRegistryKeySecretName
      ##

      # scheduler.patch.image.pullSecrets -- Names of existing image-pull Secrets for the component images.
      pullSecrets: []
    imageNew: 
      # scheduler.patch.imageNew.registry -- Container image registry; global.imageRegistry takes priority when set.
      registry: "docker.io"
      # scheduler.patch.imageNew.repository -- Container image repository name.
      repository: "liangjw/kube-webhook-certgen"
      # scheduler.patch.imageNew.tag -- Container image tag.
      tag: "v1.1.1"
      ## Specify a imagePullPolicy
      ## Defaults to 'Always' if image tag is 'latest', else set to 'IfNotPresent'
      ## ref: https://kubernetes.io/docs/user-guide/images/#pre-pulling-images
      ##

      # scheduler.patch.imageNew.pullPolicy -- Kubernetes container image pull policy.
      pullPolicy: IfNotPresent
      ## Optionally specify an array of imagePullSecrets.
      ## Secrets must be manually created in the namespace.
      ## Example:
      ## pullSecrets:
      ##   - myRegistryKeySecretName
      ##

      # scheduler.patch.imageNew.pullSecrets -- Names of existing image-pull Secrets for the component images.
      pullSecrets: []
    # scheduler.patch.priorityClassName -- PriorityClass for admission certificate creation and patch Jobs.
    priorityClassName: ""
    # scheduler.patch.podAnnotations -- Additional annotations on the Pod template.
    podAnnotations: {}
    # scheduler.patch.nodeSelector -- Required node labels for Kubernetes Pod placement.
    nodeSelector: {}
    # scheduler.patch.tolerations -- Kubernetes Pod tolerations for node taints.
    tolerations: []
    # OpenShift omits this value at render time so its SCC can allocate an allowed UID.

    # scheduler.patch.runAsUser -- User ID for admission certificate creation and patch Jobs.
    runAsUser: 2000
  service:
    # scheduler.service.type -- Service type
    type: ClusterIP  # Default type is ClusterIP, can be changed to NodePort
    # scheduler.service.httpPort -- HTTP port
    httpPort: 443   # HTTP port
    # scheduler.service.schedulerPort -- Scheduler NodePort
    schedulerPort: 31998  # NodePort for HTTP
    # scheduler.service.monitorPort -- Monitor port
    monitorPort: 31993    # Monitoring port
    # scheduler.service.monitorTargetPort -- Monitor target port
    monitorTargetPort: metrics  # Name of the container port, so it follows scheduler.metricsBindAddress
    # scheduler.service.httpTargetPort -- Scheduler container port for webhook and NUMA refit HTTP requests.
    httpTargetPort: 9443
    # scheduler.service.labels -- Additional Kubernetes labels.
    labels: {}
    # scheduler.service.annotations -- Additional Kubernetes annotations.
    annotations: {}
  networkPolicy:
    # Restrict ingress on the scheduler's HTTP port (refit and webhook share
    # bind are not on it, they are served on scheduler.extenderPort, bound to
    # loopback) to the device-plugin's pods and to the kube-system namespace, where
    # kube-scheduler and kube-apiserver normally run. See issue #2878.
    #
    # Off by default: /refit's own caller authentication (TokenReview) does
    # extra layer on top. Enable it only after confirming your CNI actually
    # matches kube-apiserver traffic against namespaceSelector/podSelector.
    # When kube-apiserver runs as a hostNetwork pod (the kubeadm/most on-prem
    # default), Kubernetes documents NetworkPolicy behavior for hostNetwork
    # pods as undefined, and it is known not to match on at least Calico
    # (projectcalico/calico#1987) and Cilium (which requires its separate
    # Host Firewall feature for host-network traffic). If this policy blocks
    # kube-apiserver's calls to /webhook, admissionWebhook.failurePolicy:
    # Ignore lets pod admission continue with HAMi's mutation silently
    # GPU device allocated and no error surfaced.

    # scheduler.networkPolicy.enabled -- Restrict scheduler HTTP ingress to selected device-plugin and kube-system peers. Validate CNI handling of hostNetwork API-server traffic before enabling.
    enabled: false

devicePlugin:
  # devicePlugin.enabled -- Deploy the NVIDIA device-plugin DaemonSet and its supporting resources.
  enabled: true
  gpuOperatorToolkitReady:
    # devicePlugin.gpuOperatorToolkitReady.enabled -- Wait for the GPU Operator toolkit-ready marker before starting the device plugin.
    enabled: false
    # devicePlugin.gpuOperatorToolkitReady.hostPath -- Host directory containing the GPU Operator toolkit-ready marker.
    hostPath: "/run/nvidia/validations"
    securityContext:
      # devicePlugin.gpuOperatorToolkitReady.securityContext.privileged -- Run the container with Kubernetes privileged security context.
      privileged: true
      # devicePlugin.gpuOperatorToolkitReady.securityContext.runAsUser -- User ID for the container process.
      runAsUser: 0
  image:
    # devicePlugin.image.registry -- Container image registry; global.imageRegistry takes priority when set.
    registry: "docker.io"
    # devicePlugin.image.repository -- Container image repository name.
    repository: "projecthami/hami"
    # devicePlugin.image.tag -- Container image tag; an empty tag uses global.imageTag.
    tag: ""
    ## Specify a imagePullPolicy
    ## Defaults to 'Always' if image tag is 'latest', else set to 'IfNotPresent'
    ## ref: https://kubernetes.io/docs/user-guide/images/#pre-pulling-images
    ##

    # devicePlugin.image.pullPolicy -- Kubernetes container image pull policy.
    pullPolicy: IfNotPresent
    ## Optionally specify an array of imagePullSecrets.
    ## Secrets must be manually created in the namespace.
    ## Example:
    ## pullSecrets:
    ##   - myRegistryKeySecretName
    ##

    # devicePlugin.image.pullSecrets -- Names of existing image-pull Secrets for the component images.
    pullSecrets: []
  vgpuCache:
    # devicePlugin.vgpuCache.gracePeriod -- Minimum directory age before stale libvgpu cache directory GC.
    # Independent of monitor.resyncInterval. Uses Go duration syntax (e.g. "5m").
    # "0s" removes the grace period, but still requires live Pod confirmation.
    # Negative durations are rejected; invalid duration strings fall back to "5m".
    gracePeriod: "5m"
  monitor:
    image:
      # devicePlugin.monitor.image.registry -- Container image registry; global.imageRegistry takes priority when set.
      registry: "docker.io"
      # devicePlugin.monitor.image.repository -- Container image repository name.
      repository: "projecthami/hami"
      # devicePlugin.monitor.image.tag -- Container image tag; an empty tag uses global.imageTag.
      tag: ""
      ## Specify a imagePullPolicy
      ## Defaults to 'Always' if image tag is 'latest', else set to 'IfNotPresent'
      ## ref: https://kubernetes.io/docs/user-guide/images/#pre-pulling-images
      ##

      # devicePlugin.monitor.image.pullPolicy -- Kubernetes container image pull policy.
      pullPolicy: IfNotPresent
      ## Optionally specify an array of imagePullSecrets.
      ## Secrets must be manually created in the namespace.
      ## Example:
      ## pullSecrets:
      ##   - myRegistryKeySecretName
      ##

      # devicePlugin.monitor.image.pullSecrets -- Names of existing image-pull Secrets for the component images.
      pullSecrets: []
    # devicePlugin.monitor.ctrPath -- Shared per-container libvgpu cache path used by the NVIDIA device plugin and monitor.
    ctrPath: /usr/local/vgpu/containers
    # devicePlugin.monitor.resyncInterval -- Monitor Pod informer resync interval and grace period for releasing mappings of missing Pods; independent of directory GC and Prometheus scrape frequency.
    resyncInterval: "5m"
    # devicePlugin.monitor.extraArgs -- Monitor extra arguments
    extraArgs:
      - -v=4
    # devicePlugin.monitor.extraEnvs -- Monitor extra environments
    extraEnvs: {}
    securityContext:
      # devicePlugin.monitor.securityContext.allowPrivilegeEscalation -- Allow the container process to gain additional privileges.
      allowPrivilegeEscalation: false
      capabilities:
        # devicePlugin.monitor.securityContext.capabilities.drop -- Linux capabilities removed from the container.
        drop: ["ALL"]
        # devicePlugin.monitor.securityContext.capabilities.add -- Linux capabilities added to the container.
        add: ["SYS_ADMIN"]
    # devicePlugin.monitor.resources -- Kubernetes CPU and memory requests and limits for the container.
    resources: {}
      # If you do want to specify resources, uncomment the following lines, adjust them as necessary.
      # and remove the curly braces after 'resources:'.
#      limits:
#        cpu: 1000m
#        memory: 1000Mi
#      requests:
#        cpu: 100m
#        memory: 100Mi

  # NUMA alignment refit (#2080): when enabled, the device plugin asks the
  # scheduler to re-run its fit over the NUMA-restricted device set kubelet
  # allows, keeping scheduler accounting authoritative. Requires
  # devices.nvidia.enableNumaTopology plus the per-node enablegetpreferredallocation node
  # configuration; pods opt in with the hami.io/numa-alignment annotation
  # (best-effort or strict). Disabled by default: mismatches are only logged.
  numaRefit:
    # devicePlugin.numaRefit.enabled -- Allow NUMA alignment refits through the scheduler; also requires devices.nvidia.enableNumaTopology and per-node enablegetpreferredallocation.
    enabled: false
    # Scheduler base URL override. Defaults to the in-cluster scheduler
    # service, https://<release>-scheduler.<namespace>.svc:<httpPort>.

    # devicePlugin.numaRefit.schedulerEndpoint -- Scheduler URL used for refit requests; empty derives the in-cluster scheduler Service URL.
    schedulerEndpoint: ""
    # The scheduler serves the admission webhook's self-signed certificate,
    # so verification is skipped by default with the same posture as the
    # extender configmap (tlsConfig.insecure). Set false to verify, and use
    # caFile to point at a CA bundle mounted into the device plugin.

    # devicePlugin.numaRefit.tlsInsecure -- Skip TLS certificate verification for scheduler refit requests.
    tlsInsecure: true
    # Path to a CA bundle already present inside the device-plugin container.

    # devicePlugin.numaRefit.caFile -- Path to a mounted CA bundle for scheduler refit TLS verification.
    caFile: ""
    # Name of a Secret (key ca.crt) to mount as the CA bundle instead; used
    # when caFile is empty.

    # devicePlugin.numaRefit.caSecret -- Secret containing ca.crt to mount for refit TLS verification when caFile is empty.
    caSecret: ""
  # Report GPU memory and core resources (e.g. nvidia.com/gpumem, nvidia.com/gpucores)
  # to Node capacity and allocatable fields. Defaults to false. Not NVIDIA-specific,
  # so this stays here rather than under devices.<vendor>.

  # devicePlugin.reportNodeCapacity -- Report device memory and core resources in Node capacity and allocatable fields.
  reportNodeCapacity: false
  # Node configuration for device plugin, Priority: externalConfigName > config > default config
  nodeConfiguration:
    # If you want to use a custom config.json, you can set the content here.
    # If this is set, it will override the default config.json(An example is as follows).

    # devicePlugin.nodeConfiguration.config -- Complete JSON node configuration. Overridden by externalConfigName; per-node settings override the global device config.
    config: |
      {
        "nodeconfig": [
          {
            "name": "your-node-name",
            "operatingmode": "hami-core",
            "devicememoryscaling": 1,
            "devicesplitcount": 10,
            "preconfigureddevicememory": 0,
            "enablenumatopology": false,
            "migstrategy": "none",
            "filterdevices": {
              "uuid": [],
              "index": []
            },
            "enablegetpreferredallocation": false
          }
        ]
      }
    # If you want to use an existing ConfigMap, you can set the name here.
    # If this is set, the chart will not create the ConfigMap and will use the existing one.

    # devicePlugin.nodeConfiguration.externalConfigName -- Existing node-configuration ConfigMap. When set, the chart uses it and does not create its own node ConfigMap.
    externalConfigName: ""
  # devicePlugin.migStrategy -- NVIDIA device-plugin MIG strategy: none or mixed.
  migStrategy: "none"
  # devicePlugin.disablecorelimit -- Value passed to the NVIDIA device-plugin disable-core-limit flag.
  disablecorelimit: "false"
  # devicePlugin.passDeviceSpecsEnabled -- Pass device specifications to kubelet through PASS_DEVICE_SPECS.
  passDeviceSpecsEnabled: true
  # devicePlugin.deviceListStrategy -- NVIDIA device-list strategy passed through DEVICE_LIST_STRATEGY.
  deviceListStrategy: "envvar"
  # devicePlugin.nvidiaHookPath -- (string) NVIDIA CDI hook path; null leaves NVIDIA_CDI_HOOK_PATH unset.
  nvidiaHookPath: null
  # Root of the NVIDIA driver on the host. Set to "auto" to read the driver
  # and device roots from GPU Operator's driver-ready contract. If the
  # contract is absent, both roots default to / for a host-installed driver.

  # devicePlugin.nvidiaDriverRoot -- NVIDIA driver root on the host. auto reads the GPU Operator driver-ready contract and uses / when it is absent.
  nvidiaDriverRoot: "auto"
  # devicePlugin.gdrcopyEnabled -- (bool) Set GDRCOPY_ENABLED; null leaves the environment variable unset.
  gdrcopyEnabled: null
  # devicePlugin.gdsEnabled -- (bool) Set GDS_ENABLED; null leaves the environment variable unset.
  gdsEnabled: null
  # devicePlugin.mofedEnabled -- (bool) Set MOFED_ENABLED; null leaves the environment variable unset.
  mofedEnabled: null

  # devicePlugin.extraArgs -- Device plugin extra arguments
  extraArgs:
    - -v=4
  # devicePlugin.extraEnvs -- Device plugin extra environments
  extraEnvs: {}
  service:
    # devicePlugin.service.type -- Service type
    type: NodePort  # Default type is NodePort, can be changed to ClusterIP
    # devicePlugin.service.httpPort -- HTTP port
    httpPort: 31992
    # devicePlugin.service.labels -- Additional Kubernetes labels.
    labels: {}
    # devicePlugin.service.annotations -- Additional Kubernetes annotations.
    annotations: {}

  # devicePlugin.pluginPath -- Host directory containing kubelet device-plugin sockets.
  pluginPath: /var/lib/kubelet/device-plugins
  # devicePlugin.libPath -- Host library directory mounted by the NVIDIA device plugin.
  libPath: /usr/local/vgpu

  # devicePlugin.podAnnotations -- Additional annotations on the Pod template.
  podAnnotations: {}
  # devicePlugin.hostPID -- Share the host PID namespace with the NVIDIA device-plugin Pod.
  hostPID: true
  # Let HAMi core ask the device plugin for its host PID.
  # This requires hostPID to be true.
  hostPIDBroker:
    # devicePlugin.hostPIDBroker.enabled -- Allow HAMi-core to obtain host process IDs through the device plugin; requires hostPID.
    enabled: false
  # devicePlugin.hostNetwork -- Use the host network for the NVIDIA device-plugin Pod.
  hostNetwork: false
  securityContext:
    # devicePlugin.securityContext.privileged -- Run the container with Kubernetes privileged security context.
    privileged: true
    # devicePlugin.securityContext.allowPrivilegeEscalation -- Allow the container process to gain additional privileges.
    allowPrivilegeEscalation: true
    capabilities:
      # devicePlugin.securityContext.capabilities.drop -- Linux capabilities removed from the container.
      drop: ["ALL"]
      # devicePlugin.securityContext.capabilities.add -- Linux capabilities added to the container.
      add: ["SYS_ADMIN"]
  nvidiaNodeSelector:
    # devicePlugin.nvidiaNodeSelector.gpu -- Required gpu node-label value for the NVIDIA device-plugin DaemonSet.
    gpu: "on"
  # NVIDIA GPU Operator commonly taints GPU nodes with this NoSchedule taint.

  # devicePlugin.tolerations -- Tolerations applied to device plugin Pods
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  updateStrategy:
    # devicePlugin.updateStrategy.type -- Kubernetes DaemonSet update strategy for the NVIDIA device plugin.
    type: RollingUpdate
    rollingUpdate:
      # devicePlugin.updateStrategy.rollingUpdate.maxUnavailable -- Maximum unavailable NVIDIA device-plugin Pods during a rolling update.
      maxUnavailable: 1

  # devicePlugin.resources -- Kubernetes CPU and memory requests and limits for the container.
  resources: {}
    # If you do want to specify resources, uncomment the following lines, adjust them as necessary.
    # and remove the curly braces after 'resources:'.
#    limits:
#       cpu: 1000m
#       memory: 1000Mi
#    requests:
#      cpu: 100m
#      memory: 100Mi

mockDevicePlugin:
  # mockDevicePlugin.enabled -- Deploy the mock device plugin for scheduler testing.
  enabled: false
  image:
    # mockDevicePlugin.image.registry -- Container image registry; global.imageRegistry takes priority when set.
    registry: "docker.io"
    # mockDevicePlugin.image.repository -- Container image repository name.
    repository: "projecthami/mock-device-plugin"
    # mockDevicePlugin.image.tag -- Container image tag.
    tag: "1.0.1"
    ## Specify a imagePullPolicy
    ## Defaults to 'Always' if image tag is 'latest', else set to 'IfNotPresent'
    ## ref: https://kubernetes.io/docs/user-guide/images/#pre-pulling-images
    ##

    # mockDevicePlugin.image.pullPolicy -- Kubernetes container image pull policy.
    pullPolicy: IfNotPresent
    ## Optionally specify an array of imagePullSecrets.
    ## Secrets must be manually created in the namespace.
    ## Example:
    ## pullSecrets:
    ##   - myRegistryKeySecretName
    ##

    # mockDevicePlugin.image.pullSecrets -- Names of existing image-pull Secrets for the component images.
    pullSecrets: []
devices:
  metax:
    # devices.metax.resourceCountName -- Kubernetes extended-resource name for device count.
    resourceCountName: "metax-tech.com/gpu"
    # devices.metax.resourceVCountName -- Kubernetes extended-resource name for virtual-device count.
    resourceVCountName: "metax-tech.com/sgpu"
    # devices.metax.resourceVCoreName -- Kubernetes extended-resource name for virtual-device cores.
    resourceVCoreName: "metax-tech.com/vcore"
    # devices.metax.resourceVMemoryName -- Kubernetes extended-resource name for virtual-device memory.
    resourceVMemoryName: "metax-tech.com/vmemory"
    # devices.metax.sgpuTopologyAware -- Enable Metax sGPU topology-aware allocation.
    sgpuTopologyAware: false
  hygon:
    # devices.hygon.memoryFactor -- Memory-unit multiplier used by this device backend when translating memory requests.
