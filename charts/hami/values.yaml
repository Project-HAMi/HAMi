# Chart-wide settings; the description of each one names the components it applies to.
global:
  # -- Global Docker image registry that replaces the registry of every HAMi image, overriding the per-component `*.image.registry` settings. Leave empty to keep the per-component registries.
  imageRegistry: ""
  # -- Global Docker image pull secrets added to the scheduler, device plugin and webhook patch job pods; the remote-gpu and mock device plugin DaemonSets do not use them. Each entry is the name of an existing docker-registry Secret, e.g. `myRegistryKeySecretName`.
  imagePullSecrets: []
  # -- Tag used by the scheduler extender, device plugin and monitor images when their own `*.image.tag` is empty. A non-empty per-component tag takes precedence. The kube-scheduler, webhook patch, mock device plugin and remote-gpu images do not use it.
  imageTag: "v2.10.0"
  # -- Directory prefix on the node where the NVIDIA vGPU hook files are installed (`<gpuHookPath>/vgpu`). Only used by the NVIDIA device plugin.
  gpuHookPath: /usr/local
  # -- Labels added to the scheduler Deployment and PodDisruptionBudget, the NVIDIA and remote-gpu DaemonSets, and the ServiceMonitors.
  labels: {}
  # -- Annotations added to the scheduler Deployment and PodDisruptionBudget and to the NVIDIA and remote-gpu DaemonSets.
  annotations: {}
  # -- When true, add `global.managedNodeSelector` to the scheduler pod as `NODE_SELECTOR_*` environment variables.
  managedNodeSelectorEnable: false
  # -- Node labels exposed to the scheduler pod when `global.managedNodeSelectorEnable` is true. Each key/value pair becomes a `NODE_SELECTOR_<KEY>` environment variable on the scheduler pod (key upper-cased, with `-`, `/` and `.` replaced by `_`), e.g. `usage: gpu` becomes `NODE_SELECTOR_USAGE=gpu`.
  managedNodeSelector:
    usage: "gpu"

# -- Replaces the chart name in resource names and in the `app.kubernetes.io/name` label. Resource names use the release name alone when it already contains this name, otherwise `<release>-<name>`. `fullnameOverride` takes precedence for resource names.
nameOverride: ""
# -- Fully overrides the names of the resources the chart creates, bypassing the `<release>-<chart>` naming. Truncated to 63 characters.
fullnameOverride: ""
# -- Namespace the chart's resources are rendered into instead of the release namespace. The chart does not create it, so it must already exist.
namespaceOverride: ""

platform:
  # -- Enable when deploying HAMi on OpenShift. Applies restricted security contexts to the scheduler extender and webhook jobs, and omits `scheduler.patch.runAsUser` so OpenShift can assign job UIDs.
  openshift: false

openshift:
  securityContextConstraints:
    # -- Create the named SecurityContextConstraints (SCC) and its use ClusterRole (`system:openshift:scc:<name>`) when `platform.openshift=true` and `name` is non-empty. The created SCC allows privileged containers, hostPath volumes, and the host PID namespace. Set to false to reuse an existing SCC and matching ClusterRole. Must be false for the built-in `privileged` SCC.
    create: true

    # -- Name of the SCC that enabled NVIDIA and mock device-plugin service accounts are allowed to use when `platform.openshift=true`. Leave empty to skip SCC creation and binding, and manage SCC access separately.
    name: "hami-device-plugin"

selinux:
  # -- Add a privileged NVIDIA device-plugin init container to recursively relabel host directories `devicePlugin.libPath`, `devicePlugin.monitor.ctrPath`, and `/tmp/vgpulock`. Creates missing directories and sets permissions to `0777` on `devicePlugin.monitor.ctrPath` and `1777` on `/tmp/vgpulock`. Requires `devicePlugin.enabled=true`. Available on any SELinux-enabled Kubernetes distribution, independently of `platform.openshift`. Uninstalling does not restore host labels or permissions.
  enabled: false
  # -- SELinux file type passed to `chcon -t` for the shared vGPU host directories when `selinux.enabled=true`. Must be a type supported by the node's SELinux policy.
  type: container_file_t
  # -- SELinux security level or range passed to `chcon -l` for the shared vGPU host directories when `selinux.enabled=true`, for example `s0` or `s0:c123,c456`.
  level: s0

# -- Name of the HAMi scheduler. The admission webhook sets it as `schedulerName` on Pods that request devices,
# the kube-scheduler container serves it, and the scheduler extender and kube-scheduler use it as their leader election lease name.
schedulerName: "hami-scheduler"

podSecurityPolicy:
  # -- Render a `policy/v1beta1` PodSecurityPolicy and its use RBAC rule for the webhook certificate creation and patch jobs. Only takes effect when `scheduler.admissionWebhook.enabled=true`, `scheduler.patch.enabled=true`, and `scheduler.certManager.enabled=false`. Keep disabled on Kubernetes 1.25 and later, where the PodSecurityPolicy API is removed.
  enabled: false

scheduler:
  # -- Node to run the scheduler Pod on, bypassing scheduling, for example when HAMi replaces the default scheduler. Empty lets Kubernetes place it;
  # `scheduler.nodeSelector` can also be set.
  nodeName: ""
  # Optional: set nodeLabelSelector to a map of node labels, such as {"gpu": "on"}. The scheduler then reads devices only from nodes with all of
  # these labels. It is passed as the `--node-label-selector` flag.
  #nodeLabelSelector:
  #  "gpu": "on"
  # -- Default for whether the admission webhook hides devices from containers that request none: `NVIDIA_VISIBLE_DEVICES=none` for NVIDIA and
  # an empty `ASCEND_VISIBLE_DEVICES` for Ascend. The Pod annotations `hami.io/overwrite-env` and `hami.io/overwrite-env-containers` override it.
  overwriteEnv: "false"
  defaultSchedulerPolicy:
    # -- Default node scoring policy: `binpack` fills busy nodes first, `spread` prefers idle ones.
    # The `hami.io/node-scheduler-policy` Pod annotation overrides it.
    nodeSchedulerPolicy: binpack
    # -- Default device scoring policy within a node: `binpack`, `spread`, or `topology-aware`.
    # `topology-aware` also makes the NVIDIA device plugin report GPU topology scores. The `hami.io/gpu-scheduler-policy` Pod annotation overrides it.
    gpuSchedulerPolicy: spread
  # -- Address the scheduler serves Prometheus metrics on, as `[host]:port`. The chart also takes the port from it for the `metrics` container port.
  metricsBindAddress: ":9395"
  # -- Address of the pprof server, used only when `--profiling` is added to `scheduler.extender.extraArgs`. Keep it on loopback and reach it
  # with `kubectl port-forward`.
  profilingBindAddress: "127.0.0.1:6060"
  # -- Queries per second the scheduler may send to kube-apiserver. Empty keeps the client default of 5. Raise it, with `kubeBurst`, on large clusters.
  kubeQPS: ""
  # -- Request burst the scheduler may send to kube-apiserver. Empty keeps the client default of 10.
  kubeBurst: ""
  # -- Timeout in seconds for scheduler requests to kube-apiserver. Empty or `0` means no timeout.
  kubeTimeout: ""
  # -- How long Bind retries locking a node held by another member of the same PodGroup, as a duration such as `28s`.
  # Empty keeps the default of `28s`, and `0` disables the retry. Keep it below `extenderHTTPTimeout`.
  nodeLockRetryTimeout: ""
  # -- Timeout in seconds that kube-scheduler gives each call to the HAMi extender. Keep it above `nodeLockRetryTimeout`, or kube-scheduler
  # cancels Bind while the extender is still retrying a node lock.
  extenderHTTPTimeout: 30
  # -- Loopback port the extender serves `/filter` and `/bind` on, for the kube-scheduler container in the same Pod. It must differ from
  # `scheduler.service.httpTargetPort`. If kube-scheduler runs outside the Pod, change `--extender-bind` through `scheduler.extender.extraArgs`.
  extenderPort: 9444
  # -- Let the admission webhook replace `default-scheduler` with `schedulerName` on Pods that request devices. Kubernetes fills in
  # `default-scheduler` for Pods that name no scheduler, so when false the webhook leaves every Pod that does not already name `schedulerName` unchanged.
  forceOverwriteDefaultScheduler: true
  # -- Add liveness probes to the scheduler containers.
  livenessProbe: false
  # -- Enable leader election for the scheduler extender and kube-scheduler. Required for `replicas` above 1; it also adds a readiness probe,
  # spreads replicas across nodes when possible, and allows the PodDisruptionBudget. Only the leader receives Service traffic.
  leaderElect: true
  # -- Number of scheduler replicas. Used only when `leaderElect` is true; otherwise one replica runs.
  replicas: 1
  podDisruptionBudget:
    # -- Minimum available scheduler Pods for the PodDisruptionBudget, which is created only when `leaderElect` is true and `replicas` is above 1.
    # Setting `podDisruptionBudget.maxUnavailable` uses that instead.
    minAvailable: 1
    # maxUnavailable: 1
  kubeScheduler:
    # -- Run a kube-scheduler container in the scheduler Pod, configured with `schedulerName` and the HAMi extender. When false, provide a scheduler
    # named `schedulerName` that calls the extender yourself; the extender listens on loopback, so also change `--extender-bind` through
    # `scheduler.extender.extraArgs`.
    enabled: true
    image:
      # -- Registry of the kube-scheduler image. `global.imageRegistry` overrides it.
      # The default is an Alibaba Cloud mirror of `registry.k8s.io/kube-scheduler`, kept because `registry.k8s.io` is hard to reach from China.
      # Elsewhere, set `registry: registry.k8s.io` and `repository: kube-scheduler` to pull the upstream image.
      registry: "registry.cn-hangzhou.aliyuncs.com"
      # -- Repository of the kube-scheduler image.
      repository: "google_containers/kube-scheduler"
      # -- Tag of the kube-scheduler image. Empty uses the cluster's Kubernetes version without distribution suffixes, such as `v1.31.1` for `v1.31.1+k3s1`.
      # `global.imageTag` does not apply to it.
      tag: ""
      # -- Pull policy of the kube-scheduler image.
      pullPolicy: IfNotPresent
      # -- Names of existing image pull Secrets for the scheduler Pod, added after `global.imagePullSecrets`. Used only when `enabled` is true.
      pullSecrets: []
    # -- Resource requests and limits for the kube-scheduler container.
    resources: {}
    # -- Complete kube-scheduler arguments on Kubernetes 1.22 and later. Keep `--config=/config/config.yaml`, the chart-generated
    # KubeSchedulerConfiguration that sets `schedulerName`, leader election, and the HAMi extender.
    extraNewArgs:
      - --config=/config/config.yaml
      - -v=4
    # -- Extra kube-scheduler arguments on Kubernetes versions before 1.22, after the chart's `--scheduler-name` flag and before its leader election flags.
    # Keep `--policy-config-file=/config/config.json`, the chart-generated Policy that adds the HAMi extender.
    extraArgs:
      - --policy-config-file=/config/config.json
      - -v=4
  extender:
    image:
      # -- Registry of the scheduler extender image. `global.imageRegistry` overrides it.
      registry: "docker.io"
      # -- Repository of the scheduler extender image.
      repository: "projecthami/hami"
      # -- Tag of the scheduler extender image. Empty uses `global.imageTag`.
      tag: ""
      # -- Pull policy of the scheduler extender image.
      pullPolicy: IfNotPresent
      # -- Names of existing image pull Secrets for the scheduler Pod, added after `global.imagePullSecrets`.
      pullSecrets: []
    # -- Resource requests and limits for the scheduler extender container.
    resources: {}
    # -- Extra command-line flags for the scheduler extender, appended after the flags the chart generates,
    # such as `--profiling` to serve pprof on `scheduler.profilingBindAddress`.
    extraArgs:
      - --debug
      - -v=4
  # -- Age after which a node lock is treated as expired, as a positive duration such as `5m`. An unparsable or non-positive value is ignored
  # and `5m` is used. A `--node-lock-timeout` flag in `scheduler.extender.extraArgs` overrides it.
  nodeLockExpire: "5m"
  # -- Annotations for the scheduler Pods.
  podAnnotations: {}
  # -- Tolerations for the scheduler Pods.
  tolerations: []
  admissionWebhook:
    # -- Install the mutating admission webhook. It rejects Pods that preset HAMi allocation annotations, and for Pods that request devices it applies
    # each device backend's admission changes, sets `schedulerName`, checks ResourceQuota, and rejects privileged containers. When false, Pods that should
    # use HAMi must set `schedulerName` and their device settings themselves, and the scheduler serves its HTTP port without TLS.
    enabled: true
    customURL:
      # -- Have kube-apiserver call the webhook at `https://<host>:<port><path>`, such as a node port, instead of through the scheduler Service.
      enabled: false
      # -- Host name or IP address in the custom webhook URL. The certificate from the `patch` Jobs includes it; the cert-manager certificate does not.
      host: 127.0.0.1
      # -- Port in the custom webhook URL. The default matches `scheduler.service.schedulerPort`.
      port: 31998
      # -- Path in the custom webhook URL. The scheduler serves the webhook on `/webhook`.
      path: /webhook
    # -- (list) Names of namespaces whose Pods the webhook skips, such as `kube-system`. Applies only when `manageNamespaceSelector` is true.
    # @default -- unset
    whitelistNamespaces:
    # -- Render the webhook's `namespaceSelector`. Set it to false on platforms that manage that field themselves, such as AKS, to avoid
    # server-side apply conflicts. `whitelistNamespaces` and `namespaceSelector` then have no effect.
    manageNamespaceSelector: true
    namespaceSelector:
      # -- (object) Labels a namespace must have for the webhook to apply to its Pods. Applies only when `manageNamespaceSelector` is true.
      # @default -- unset
      matchLabels:
      # -- Extra namespace selector expressions, added after the built-in one that skips namespaces labeled `hami.io/webhook: ignore`.
      # Applies only when `manageNamespaceSelector` is true.
      matchExpressions: []
    objectSelector:
      # -- Extra Pod selector expressions, added after the built-in one that skips Pods labeled `hami.io/webhook: ignore`.
      # Labels a Pod must have can also be set as `objectSelector.matchLabels`.
      matchExpressions: []
    # -- Whether kube-apiserver calls the webhook again after a later mutating webhook changes the Pod: `Never` or `IfNeeded`.
    reinvocationPolicy: Never
    # -- What kube-apiserver does when it cannot reach the webhook. `Ignore` admits the Pod without HAMi's changes and without an error.
    # `Fail` rejects the request; because the webhook handles every Pod create and update in the selected namespaces, an unavailable scheduler then blocks them all.
    failurePolicy: Ignore
  certManager:
    # -- Use cert-manager for the admission webhook certificate. The chart creates a self-signed Issuer and a Certificate for
    # `<scheduler Service>.<namespace>.svc` stored in Secret `<fullname>-scheduler-tls`, and annotates the webhook so cert-manager injects its CA.
    # Requires cert-manager in the cluster and `admissionWebhook.enabled`. Takes precedence over `patch`.
    # With both `certManager.enabled` and `patch.enabled` false, create that Secret with `tls.crt` and `tls.key` and set the webhook CA yourself.
    enabled: false
  patch:
    # -- Use kube-webhook-certgen Jobs for the admission webhook certificate when `certManager.enabled` is false. A pre-install and pre-upgrade hook Job
    # writes a self-signed certificate to Secret `<fullname>-scheduler-tls`, and a post-install and post-upgrade hook Job sets its CA on the webhook.
    # Requires `admissionWebhook.enabled`.
    enabled: true
    image:
      # -- Registry of the certgen image used on Kubernetes versions before 1.22. `global.imageRegistry` overrides it.
      registry: "docker.io"
      # -- Repository of the certgen image used on Kubernetes versions before 1.22.
      repository: "jettech/kube-webhook-certgen"
      # -- Tag of the certgen image used on Kubernetes versions before 1.22, pinned by digest.
      tag: "v1.5.2@sha256:2217d8028431f82afef26b0023ff8b9247971be3964a22e80ef5ca2f36e1a293"
      # -- Pull policy of the certgen image used on Kubernetes versions before 1.22.
      pullPolicy: IfNotPresent
      # -- Names of existing image pull Secrets for the certgen Jobs on Kubernetes versions before 1.22, added after `global.imagePullSecrets`.
      pullSecrets: []
    imageNew:
      # -- Registry of the certgen image used on Kubernetes 1.22 and later. `global.imageRegistry` overrides it.
      registry: "docker.io"
      # -- Repository of the certgen image used on Kubernetes 1.22 and later.
      repository: "liangjw/kube-webhook-certgen"
      # -- Tag of the certgen image used on Kubernetes 1.22 and later, pinned by digest.
      tag: "v1.1.1@sha256:64d8c73dca984af206adf9d6d7e46aa550362b1d7a01f3a0a91b20cc67868660"
      # -- Pull policy of the certgen image used on Kubernetes 1.22 and later.
      pullPolicy: IfNotPresent
      # -- Names of existing image pull Secrets for the certgen Jobs on Kubernetes 1.22 and later, added after `global.imagePullSecrets`.
      pullSecrets: []
    # -- PriorityClass for the certgen Job Pods. Empty sets none.
    priorityClassName: ""
    # -- Annotations for the certgen Job Pods.
    podAnnotations: {}
    # -- Node selector for the certgen Job Pods.
    nodeSelector: {}
    # -- Tolerations for the certgen Job Pods.
    tolerations: []
    # -- User ID the certgen Job Pods run as. They always run as non-root. Not set when `platform.openshift` is true,
    # so the OpenShift SCC can assign an allowed UID, or when this value is `0` or empty.
    runAsUser: 2000
  service:
    # -- Type of the scheduler Service, which routes only to the scheduler Pod holding leadership. With `NodePort`, the chart also sets the node ports
    # from `schedulerPort` and `monitorPort`. Empty uses `ClusterIP`.
    type: ClusterIP
    # -- Service port for the scheduler's HTTP port. The admission webhook and the device plugin's default NUMA refit endpoint reach the scheduler through it.
    httpPort: 443
    # -- Node port for the HTTP port when `type` is `NodePort`.
    schedulerPort: 31998
    # -- Service port for scheduler metrics. When `type` is `NodePort`, it is also used as the node port, so it must be in the cluster's node port range.
    monitorPort: 31993
    # -- Container port the metrics Service port targets, by number or name. The default `metrics` names the container port taken from `scheduler.metricsBindAddress`.
    monitorTargetPort: metrics
    # -- Container port the scheduler serves the admission webhook, `/refit`, and probes on. It must differ from `scheduler.extenderPort`.
    httpTargetPort: 9443
    # -- Extra labels for the scheduler Service.
    labels: {}
    # -- Annotations for the scheduler Service.
    annotations: {}
  networkPolicy:
    # -- Create a NetworkPolicy for the scheduler Pods. It admits traffic to the HTTP port (`scheduler.service.httpTargetPort`), which serves the admission
    # webhook and the device plugin's `/refit` calls, only from this release's device plugin Pods and the `kube-system` namespace, leaves the metrics port
    # open to all sources, and denies other ingress. Enable it only if your CNI matches kube-apiserver traffic against `namespaceSelector`: when kube-apiserver
    # uses host networking, many CNIs do not, and with `admissionWebhook.failurePolicy: Ignore` Pods are then admitted without HAMi's changes and without an error.
    enabled: false

devicePlugin:
  # -- Deploy the NVIDIA device plugin DaemonSet, including the vGPU monitor container.
  enabled: true
  gpuOperatorToolkitReady:
    # -- Wait for `<hostPath>/toolkit-ready` in an init container before starting the device plugin and monitor.
    enabled: false
    # -- Host directory containing `toolkit-ready`. Also supplies `driver-ready` when
    # `devicePlugin.nvidiaDriverRoot=auto`.
    hostPath: "/run/nvidia/validations"
    # -- Security context for the toolkit-validation init container.
    securityContext:
      privileged: true
      runAsUser: 0
  image:
    # -- NVIDIA device plugin image registry. Overridden by a non-empty `global.imageRegistry`.
    registry: "docker.io"
    # -- Image repository for the NVIDIA device plugin container and the `selinux-relabel` and
    # `toolkit-validation` init containers when enabled.
    repository: "projecthami/hami"
    # -- NVIDIA device plugin image tag. Empty uses `global.imageTag`.
    tag: ""
    # -- Image pull policy for the NVIDIA device plugin and its enabled init containers: `Always`,
    # `IfNotPresent`, or `Never`.
    pullPolicy: IfNotPresent
    # -- Image pull Secret names for the device plugin Pod, appended to `global.imagePullSecrets`,
    # e.g. `[myRegistryKeySecretName]`.
    pullSecrets: []
  vgpuCache:
    # -- Minimum cache directory age, measured from its modification time, before garbage collection. Use
    # Go duration syntax such as `30s`, `5m`, or `1h`. Empty or invalid values use `5m`; negative durations
    # prevent startup. `0s` removes the age grace period but still requires live Pod confirmation. Independent
    # of monitor resync and the GC scan interval.
    gracePeriod: "5m"
  monitor:
    image:
      # -- Monitor image registry. Overridden by a non-empty `global.imageRegistry`.
      registry: "docker.io"
      # -- Monitor image repository.
      repository: "projecthami/hami"
      # -- Monitor image tag. Empty uses `global.imageTag`.
      tag: ""
      # -- Monitor image pull policy: `Always`, `IfNotPresent`, or `Never`.
      pullPolicy: IfNotPresent
      # -- Monitor image pull Secret names. Currently unused by the DaemonSet; configure
      # `devicePlugin.image.pullSecrets` or `global.imagePullSecrets` for the shared Pod.
      pullSecrets: []
    # -- Shared per-container libvgpu cache path used by the device plugin and monitor.
    ctrPath: /usr/local/vgpu/containers
    # -- Address the monitor serves `/metrics` on. The container port, Service target port and probes
    # follow it. Loopback addresses are rejected. Set it here, not in `extraArgs`.
    metricsBindAddress: ":9394"
    probes:
      # -- Run the monitor liveness and readiness probes. Disable to debug inside the container.
      enabled: true
    # -- Monitor Pod informer resync interval and grace period for releasing mappings of missing Pods.
    # Does not control directory GC or Prometheus scrape frequency.
    resyncInterval: "5m"
    # -- Disable the HAMi-core hook for whole-GPU containers when memory and core scaling are both 1;
    # the monitor reads their metrics from NVML instead. Whole-GPU means a non-MIG device with full
    # device memory allocated and cores unrequested or `gpucores=100`.
    disableHAMiCoreForWholeGPU: true
    # -- Additional monitor command-line arguments as a list of strings.
    extraArgs:
      - -v=4
    # -- Extra Kubernetes env entries for the vGPU monitor, as a list of objects with name and value or valueFrom.
    extraEnvs: []
    # -- Security context for the monitor container.
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
        add: ["SYS_ADMIN"]
    # -- Resource requests and limits for the monitor container.
    resources: {}
      # If you do want to specify resources, uncomment the following lines, adjust them as necessary.
      # and remove the curly braces after 'resources:'.
#      limits:
#        cpu: 1000m
#        memory: 1000Mi
#      requests:
#        cpu: 100m
#        memory: 100Mi

  numaRefit:
    # -- NUMA alignment refit (#2080): when enabled, the device plugin asks the
    # scheduler to re-run its fit over the NUMA-restricted device set kubelet
    # allows, keeping scheduler accounting authoritative. Requires
    # devices.nvidia.enableNumaTopology plus the per-node enablegetpreferredallocation node
    # configuration; pods opt in with the hami.io/numa-alignment annotation
    # (best-effort or strict). Disabled by default: mismatches are only logged.
    enabled: false
    # -- Scheduler base URL override. Defaults to the in-cluster scheduler
    # service, `https://<release>-scheduler.<namespace>.svc:<scheduler.service.httpPort>`.
    schedulerEndpoint: ""
    # -- The scheduler serves the admission webhook's self-signed certificate,
    # so verification is skipped by default with the same posture as the
    # extender configmap (tlsConfig.insecure). Set false to verify, and use
    # caFile to point at a CA bundle mounted into the device plugin.
    tlsInsecure: true
    # -- Path to a CA bundle already present inside the device-plugin container.
    caFile: ""
    # -- Name of a Secret (key ca.crt) to mount as the CA bundle instead; used
    # when caFile is empty.
    caSecret: ""
  # -- Report GPU memory and core resources in Node capacity and allocatable. The `reportnodecapacity`
  # JSON field in `nodeConfiguration.config` overrides this setting for matching nodes.
  reportNodeCapacity: false
  nodeConfiguration:
    # operatingmode is per-node: "hami-core", "mig", or "remote".
    # "remote" makes this node a Lupine GPU server; the plugin applies
    # hami.io/lupine-server (empty value = devices.remotegpu.defaultPort).
    # -- JSON content for the generated device plugin ConfigMap key `config.json`; ignored when
    # `externalConfigName` is set. The `nodeconfig` list selects entries whose `name` matches the node. If
    # none match, it selects matching `nodelabelselector` entries; if neither matches, it uses entries named
    # `*`. For example, use
    # `{"nodelabelselector":{"matchLabels":{"gpu.example.com/pool":"mig"}},"operatingmode":"mig"}`. Node
    # labels are read at plugin startup; restart the plugin after changing them and use labels available when
    # the node registers.
    # Selected entries apply in list order; later overrides take precedence. For per-node resource
    # settings, null, zero, or false does not replace an existing non-zero or true value. Empty
    # `operatingmode` and `filterdevices` values are ignored. Entries with both or neither of `name` and
    # `nodelabelselector`, or with an empty or invalid label selector, are skipped.
    # @default -- Example node configuration; see [values.yaml](values.yaml).
    config: |
      {
        "nodeconfig": [
          {
            "name": "your-node-name",
            "operatingmode": "hami-core",
            "devicememoryscaling": 1,
            "devicecorescaling": null,
            "devicesplitcount": 10,
            "preconfigureddevicememory": 0,
            "libcudaloglevel": null,
            "enablenumatopology": false,
            "reportnodecapacity": null,
            "migstrategy": "none",
            "filterdevices": {
              "uuid": [],
              "index": []
            },
            "enablegetpreferredallocation": false
          }
        ]
      }
    # -- Existing ConfigMap containing a `config.json` key in the Pod namespace. When non-empty, the chart
    # mounts it instead of creating a ConfigMap from `nodeConfiguration.config`.
    externalConfigName: ""
  # -- Strategy for exposing NVIDIA MIG devices: `none`, `single`, or `mixed`. `mixed` exposes MIG profiles as
  # separate resources. Passed as `--mig-strategy`.
  migStrategy: "none"
  # -- Set to `"true"` to disable HAMi-core utilization limits. This value is
  # merged with `nvidia.disableCoreLimit` in `device-config.yaml`; either one
  # being true disables limits, while `"false"` does not override a true file value.
  disablecorelimit: "false"
  # -- Pass device specifications to kubelet in Allocate responses. Ignored when `deviceListStrategy`
  # contains only CDI strategies. Null leaves the plugin default unchanged (disabled).
  passDeviceSpecsEnabled: true
  # -- Comma-separated device list strategies passed to the container runtime: `envvar`, `volume-mounts`,
  # `cdi-annotations`, or `cdi-cri`. CDI strategies require a CDI-capable runtime; `cdi-cri` also requires
  # kubelet/CRI support for CDI devices.
  deviceListStrategy: "envvar"
  # -- (string) Path for NVIDIA CDI hooks in generated CDI specifications. Null omits `NVIDIA_CDI_HOOK_PATH`
  # and keeps the plugin default `/usr/bin/nvidia-ctk`.
  nvidiaHookPath: null
  # -- Root of the NVIDIA driver on the host. Set to "auto" to read the driver
  # and device roots from GPU Operator's driver-ready contract. If the
  # contract is absent, both roots default to / for a host-installed driver.
  # In auto mode the device plugin uses the driver injected by the NVIDIA
  # Container Toolkit, so it must run with the NVIDIA runtime; the host root is
  # mounted read-only only when deviceListStrategy uses a cdi-* strategy.
  nvidiaDriverRoot: "auto"
  # -- (bool) Enable GDRCopy support for allocated GPU containers. A boolean sets `GDRCOPY_ENABLED`; null
  # leaves the plugin default unchanged (disabled). Requires the corresponding host drivers and runtime
  # support.
  gdrcopyEnabled: null
  # -- (bool) Enable GPUDirect Storage support for allocated GPU containers. A boolean sets `GDS_ENABLED`;
  # null leaves the plugin default unchanged (disabled). Requires the corresponding host drivers and runtime
  # support.
  gdsEnabled: null
  # -- (bool) Enable MOFED support for allocated GPU containers. A boolean sets `MOFED_ENABLED`; null leaves
  # the plugin default unchanged (disabled). Requires the corresponding host drivers and runtime support.
  mofedEnabled: null

  # -- Additional NVIDIA device plugin command-line arguments as a list of strings.
  extraArgs:
    - -v=4
  # -- Extra Kubernetes env entries for the device plugin, as a list of objects with name and value or
  # valueFrom.
  extraEnvs: []
  service:
    # -- Service type for vGPU monitor metrics. Empty uses `NodePort`; `ClusterIP` exposes metrics only within
    # the cluster.
    type: NodePort
    # -- Monitor Service port. Also used as the nodePort when `service.type=NodePort`. Empty or zero uses
    # 31992; the target port follows `monitor.metricsBindAddress`.
    httpPort: 31992
    # -- Additional labels for the vGPU monitor Service, as a map of label names to string values.
    labels: {}
    # -- Annotations for the vGPU monitor Service, as a map of annotation names to string values.
    annotations: {}

  # -- Host kubelet device-plugin socket directory, mounted at `/var/lib/kubelet/device-plugins` inside the
  # device plugin container.
  pluginPath: /var/lib/kubelet/device-plugins
  # -- Host directory for HAMi-core library files, mounted at `<global.gpuHookPath>/vgpu` inside the device
  # plugin container.
  libPath: /usr/local/vgpu

  # -- Additional annotations for NVIDIA device plugin Pods, as a map of annotation names to string values.
  podAnnotations: {}
  # -- Use the host PID namespace for NVIDIA device plugin Pods. Must be true when `hostPIDBroker.enabled` is
  # true.
  hostPID: true
  hostPIDBroker:
    # -- Enable the host PID broker so HAMi-core can query the device plugin for its host PID. Requires
    # `hostPID=true`; mounts the broker socket directory at `/var/run/hami/hostpid`.
    # See [Host PID broker](https://project-hami.io/docs/next/developers/hostpid-broker).
    enabled: false
  # -- Use the host network for NVIDIA device plugin Pods. When enabled, the chart sets `dnsPolicy:
  # ClusterFirstWithHostNet` so the scheduler Service remains resolvable.
  hostNetwork: false
  # -- Kubernetes container security context for the NVIDIA device plugin.
  securityContext:
    privileged: true
    allowPrivilegeEscalation: true
    capabilities:
      drop: ["ALL"]
      add: ["SYS_ADMIN"]
  # -- Node labels required for NVIDIA device plugin Pods, as a map of label names to string values.
  nvidiaNodeSelector:
    gpu: "on"
  # -- Kubernetes tolerations for NVIDIA device plugin Pods, as a list of objects with key, operator, value,
  # effect, and optional tolerationSeconds.
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  # -- Kubernetes DaemonSet update strategy: `RollingUpdate` or `OnDelete`. For RollingUpdate, configure
  # `rollingUpdate.maxUnavailable` as a count or percentage.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

  # -- Kubernetes resource requests and limits for the NVIDIA device plugin container, for example `{requests:
  # {cpu: 100m, memory: 100Mi}, limits: {memory: 1Gi}}`.
  resources: {}

mockDevicePlugin:
  # -- Deploy the mock device plugin as a DaemonSet on all eligible nodes without node selectors.
  enabled: false
  image:
    # -- Image registry, overridden by `global.imageRegistry`.
    registry: "docker.io"
    # -- Image repository for the mock-device-plugin.
    repository: "projecthami/mock-device-plugin"
    # -- Image tag (required), pinned by digest; does not inherit `global.imageTag`.
    tag: "1.0.1@sha256:61d08a5641251ed776e4701c0dcf05c2c2bed5a58b39b8a11ec85ca5e57e674a"
    # -- Image pull policy: `Always`, `IfNotPresent`, or `Never`.
    pullPolicy: IfNotPresent
    pullSecrets: []
devices:
  metax:
    resourceCountName: "metax-tech.com/gpu"
    resourceVCountName: "metax-tech.com/sgpu"
    resourceVCoreName: "metax-tech.com/vcore"
    resourceVMemoryName: "metax-tech.com/vmemory"
    sgpuTopologyAware: false
  hygon:
    memoryFactor: 1
    resourceCountName: "hygon.com/hcunum"
    resourceMemoryName: "hygon.com/hcumem"
    resourceCoreName: "hygon.com/hcucores"
  cambricon:
    # -- Resource name for the number of MLUs a container requests; it must match the Cambricon device plugin.
    # A zero count requests no device; HAMi reads memory and core requests only for a positive count.
    # Sharing needs one MLU and the plugin in `dynamic-smlu` mode; a count above 1 allocates whole MLUs and ignores the memory and core values.
    # A non-empty `device-config.content` or a bundled `files/device-config.yaml` replaces the generated device configuration, so set the name there too.
    resourceCountName: "cambricon.com/vmlu"
    # -- Resource name for MLU memory, requested in integer units of 256 MiB (`20` is 5120 MiB); run the plugin with `min-dsmlu-unit=256`.
    # Omitted or 0 reserves the whole MLU memory.
    # Set the name in `device-config.content` or `files/device-config.yaml` too when either replaces the generated configuration.
    resourceMemoryName: "cambricon.com/mlu.smlu.vmemory"
    # -- Resource name for MLU compute, requested as an integer percentage from 0 to 100; omitted requests 100.
    # Set the name in `device-config.content` or `files/device-config.yaml` too when either replaces the generated configuration.
    resourceCoreName: "cambricon.com/mlu.smlu.vcore"
  amd:
    resourceCountName: "amd.com/gpu"
    resourceMemoryName: "amd.com/gpumem"
    resourceMemoryPercentageName: "amd.com/gpumem-percentage"
    resourceCoreName: "amd.com/gpucores"
    runtimeClassName: ""  # Name of the runtime class to set on Pods that request an AMD GPU
    # GPUs a container gets when it asks for memory or cores without amd.com/gpu.
    defaultGPUNum: 1
    # MiB of device memory for a container that asks for neither memory nor a percentage; 0 is the whole GPU.
    defaultMemory: 0
    # Percent of the cores for a container that asks for none; 0 is all of them.
    defaultCores: 0
    customresources:
      - amd.com/gpu
      - amd.com/gpumem
      - amd.com/gpucores
  awsneuron:
    resourceCountName: "aws.amazon.com/neuron"
    resourceCoreName: "aws.amazon.com/neuroncore"
    customresources:
      - aws.amazon.com/neuron
      - aws.amazon.com/neuroncore
  kunlun:
    resourceCountName: "kunlunxin.com/xpu"
    resourceVCountName: "kunlunxin.com/vxpu"
    resourceVMemoryName: "kunlunxin.com/vxpu-memory"
    enabled: true
    # devices.kunlun.customresources -- Additional resource names forwarded to the scheduler extender; standard resources are added automatically from the named resource fields.
    customresources: []
  enflame:
    resourceNameGCU: "enflame.com/gcu"
    resourceNameDRSGCU: "enflame.com/drs-gcu"
    resourceNameGCUMemory: "enflame.com/gcu-memory"
    resourceNameGCUCore: "enflame.com/gcu-core"
    enabled: true
    # devices.enflame.customresources -- Additional resource names forwarded to the scheduler extender; standard resources are added automatically from the named resource fields.
    customresources: []
  mthreads:
    # -- Register customresources with the HAMi scheduler extender. The MThreads toolkit must be installed separately.
    enabled: true
    # -- Resource names managed by the scheduler extender when enabled. Include resourceCountName; it is not added automatically.
    customresources:
      - mthreads.com/vgpu
    # -- Resource name for MThreads GPU count requests. Must match the vendor device plugin and the entry in customresources. Requesting only this resource allocates exclusive GPUs.
    resourceCountName: "mthreads.com/vgpu"
    # -- Resource name for sGPU memory requests in integer units of 512 MiB (32 = 16 GiB). When memory is not requested, HAMi uses the selected node's per-card capacity.
    resourceMemoryName: "mthreads.com/sgpu-memory"
    # -- Resource name for integer sGPU time-sharing weight requests. HAMi accounts for 16 units per card: a single-card request of 8 consumes 8/16 of its allocatable compute units. Device sharing for multi-cards is not supported. For multi-card requests, HAMi overwrites the compute request with 16 units per card. Actual GPU time depends on the vendor scheduling policy and competing workloads.
    resourceCoreName: "mthreads.com/sgpu-core"
    # -- (list) Per-card capacities in 512 MiB units used to validate explicit single-device memory limits, not to set node capacity. 96 = MTT S4000 (48 GiB); 160 = MTT S5000 (80 GiB). Use [96, 160] for mixed fleets. Allowed limits are the union of powers of two starting at 2 and each full-card capacity. An empty list falls back to [96]; a legacy scalar is converted to a one-item list.
    memoryPerCard:
      - 96
  vastai:
    resourceCountName: "vastaitech.com/va"
    enabled: true
    # devices.vastai.customresources -- Additional resource names forwarded to the scheduler extender; standard resources are added automatically from the named resource fields.
    customresources: []
  biren:
    resourceCountName: "birentech.com/gpu"
    enabled: true
    # devices.biren.customresources -- Additional resource names forwarded to the scheduler extender; standard resources are added automatically from the named resource fields.
    customresources: []
  # Most devices.nvidia values are written to the generated device-config.yaml that
  # the scheduler and the device plugin read. When device-config.content is set, it
  # replaces that file and those values no longer reach either component.
  nvidia:
    # -- In the `mig` operating mode, let the device plugin adopt, when it starts, MIG instances HAMi has no record of creating, so it can reuse or destroy them.
    # When false, they are left untouched. Enable it only when HAMi alone manages the MIG layout of the node.
    adoptExistingMIGInstances: false
    # -- MIG profiles HAMi may create on nodes whose device plugin runs in the `mig` operating mode.
    # Each entry has `models`, a list of GPU model names matched as substrings of the name NVML reports,
    # and `profiles`, a list of MIG profile names such as `1g.10gb`, for example `{models: ["A30"], profiles: ["1g.6gb", "2g.12gb"]}`.
    # The first entry that matches a GPU's model decides the profiles for that GPU; a GPU that no entry matches is not registered.
    # The `nvidia.com/mig-profile-preference` Pod annotation accepts only listed profiles or their slice prefix, such as `4g`.
    # The scheduler and device plugin fail to start if an entry has empty `models` or `profiles`, or if a profile name has no `.`
    # or its part before the first `.` is not at least two characters ending in `g`. The part after the `.` is not checked.
    # A profile that passes this check but names a slice count the GPU does not support, such as `5g.20gb`, is skipped on the node.
    # Setting this value replaces the whole default list.
    # @default -- Profiles for A30, A100, H100, H20, GH200, H200, B200, and RTX PRO 6000 Blackwell Server Edition
    migProfileAllowlist:
      - models: [ "A30" ]
        profiles: [ "1g.6gb", "2g.12gb", "4g.24gb" ]
      - models: [ "A100-SXM4-40GB", "A100-40GB-PCIe", "A100-PCIE-40GB"]
        profiles: [ "1g.5gb", "2g.10gb", "3g.20gb", "4g.20gb", "7g.40gb" ]
      - models: [ "A100-SXM4-80GB", "A100-80GB-PCIe", "A100-PCIE-80GB"]
        profiles: [ "1g.10gb", "2g.20gb", "3g.40gb", "4g.40gb", "7g.79gb" ]
      - models: [ "H100-PCIE-80GB", "H100-SXM5-80GB"]
        profiles: [ "1g.10gb", "2g.20gb", "3g.40gb", "4g.40gb", "7g.80gb" ]
      - models: [ "H100-PCIE-94GB", "H100-SXM5-94GB"]
        profiles: [ "1g.12gb", "2g.24gb", "3g.47gb", "4g.47gb", "7g.94gb" ]
      - models: [ "H20", "H100 on GH200"]
        profiles: [ "1g.12gb", "2g.24gb", "3g.48gb", "4g.48gb", "7g.96gb" ]
      - models: [ "H200 NVL", "H200-SXM5"]
        profiles: [ "1g.18gb", "2g.35gb", "3g.71gb", "4g.71gb", "7g.141gb" ]
      - models: [ "B200" ]
        profiles: [ "1g.23gb", "2g.45gb", "3g.90gb", "4g.90gb", "7g.180gb" ]
      - models: [ "RTX PRO 6000 Blackwell Server Edition" ]
        profiles: [ "1g.24gb", "2g.48gb", "4g.96gb" ]
    # -- GPU memory in MiB assigned to each requested GPU when a container sets neither the `resourceMemoryName` nor the `resourceMemoryPercentageName` resource, or sets them to `0`.
    # `0` assigns the whole memory of the GPU. `memoryFactor` does not apply to this value. Must not be negative.
    defaultMemory: 0
    # -- Percentage of GPU cores, from 0 to 100, assigned to each requested GPU when a container does not set the `resourceCoreName` resource.
    # `0` reserves no cores and sets no core limit.
    # When the admission webhook is enabled, a container that requests GPUs without a memory amount, or with 100% of the memory, gets 100 instead,
    # which requests each GPU exclusively when `deviceCoreScaling` is 1.
    defaultCores: 0
    # -- Number of GPUs the admission webhook adds to a container that sets a `resourceMemoryName`, `resourceMemoryPercentageName`, or `resourceCoreName` limit but no `resourceCountName` limit.
    # `0` adds nothing, so such a container is not treated as an NVIDIA GPU request.
    defaultGPUNum: 1
    # -- Multiplier applied to the `resourceMemoryName` value a container requests, which is otherwise in MiB.
    # For example, `1024` makes `nvidia.com/gpumem: 4` request 4 GiB. ResourceQuota limits for that resource are scaled the same way.
    # `0` and `1` disable scaling. Must not be negative.
    memoryFactor: 1
    # -- Extended resource name for the number of NVIDIA GPUs a container requests.
    # The device plugin registers it with kubelet, advertising each physical GPU `deviceSplitCount` times.
    resourceCountName: "nvidia.com/gpu"
    # -- Extended resource name for the GPU memory a container requests on each GPU, in MiB multiplied by `memoryFactor`.
    resourceMemoryName: "nvidia.com/gpumem"
    # -- Extended resource name for the GPU memory a container requests on each GPU as a percentage of that GPU's memory, an integer from 0 to 100.
    # `0` is treated as unset.
    resourceMemoryPercentageName: "nvidia.com/gpumem-percentage"
    # -- Extended resource name for the GPU cores a container requests on each GPU, as an integer percentage from 0 to 100.
    # `0` reserves no cores and sets no core limit. With `deviceCoreScaling: 1`, `100` requests each GPU exclusively.
    resourceCoreName: "nvidia.com/gpucores"
    # -- Extended resource name for the task priority of a container. The admission webhook passes its limit to HAMi-core as `CUDA_TASK_PRIORITY`.
    # A lower value is a higher priority, and HAMi-core uses `1` when it is unset.
    # On a shared GPU, vGPUmonitor pauses kernel launches of lower-priority tasks while higher-priority tasks are active,
    # but only for tasks with a `resourceCoreName` limit between 1 and 99 whose core limit is being enforced (see `gpuCorePolicy`).
    resourcePriorityName: "nvidia.com/priority"
    # -- Number of vGPUs each physical GPU is advertised as, which is the maximum number of containers that can share one GPU.
    # In the `mig` operating mode, the number of MIG instances a GPU can hold limits sharing instead.
    # A device-plugin `nodeconfig` entry can override it per node with `devicesplitcount`.
    deviceSplitCount: 10
    # -- (float) Factor applied to the memory each GPU reports to the scheduler. Accepts decimals, such as `1.5`.
    # A value above `1` lets the memory requests on one GPU add up to more than its physical memory, and the device plugin sets `CUDA_OVERSUBSCRIBE=true` in those containers.
    # Not applied in the `mig` operating mode. A device-plugin `nodeconfig` entry can override it per node with `devicememoryscaling`.
    deviceMemoryScaling: 1
    # -- (float) Factor applied to the cores each GPU reports to the scheduler, which is `100` times this value. Accepts decimals, such as `1.5`.
    # A value above `1` lets the `resourceCoreName` requests on one GPU add up to more than 100.
    # Not applied in the `mig` operating mode. A device-plugin `nodeconfig` entry can override it per node with `devicecorescaling`.
    deviceCoreScaling: 1
    # -- Total memory in MiB registered for a GPU whose memory NVML cannot query, such as a unified-memory GPU like the NVIDIA GB10.
    # GPUs that report their memory always use the reported value.
    # `0` skips GPUs whose memory cannot be queried. A device-plugin `nodeconfig` entry can override it per node with `preconfigureddevicememory`.
    preConfiguredDeviceMemory: 0
    # -- Advertise each GPU's NUMA node on its vGPUs so kubelet's Topology Manager can align CPUs and GPUs.
    # Disabled by default because the `single-numa-node` Topology Manager policy then changes which Pods kubelet admits.
    # A device-plugin `nodeconfig` entry can override it per node with `enablenumatopology`.
    enableNumaTopology: false
    # -- RuntimeClass set on the device plugin Pods and, by the admission webhook, on GPU Pods that do not set `runtimeClassName`, commonly `nvidia` when the NVIDIA container runtime is not the default.
    # The RuntimeClass must exist, either created by `createRuntimeClass` or already present in the cluster. Empty sets no RuntimeClass.
    runtimeClassName: ""
    # -- Create the RuntimeClass named by `runtimeClassName`, with the `nvidia` handler, when `devicePlugin.enabled` is true.
    # Has no effect when `runtimeClassName` is empty. Leave it false if the RuntimeClass already exists, such as one created by the GPU Operator.
    createRuntimeClass: false
    # -- How HAMi-core enforces the `resourceCoreName` limit. The admission webhook passes values other than `default` as `GPU_CORE_UTILIZATION_POLICY`.
    # `default` lets vGPUmonitor turn enforcement on only while it sees other active tasks of the same or higher priority on the GPU.
    # `force` always enforces it. `disable` never enforces it. HAMi-core treats any other value as `default`. Limits of 0 and 100 are never enforced.
    gpuCorePolicy: default
    # -- HAMi-core log level, passed to containers as `LIBCUDA_LOG_LEVEL`.
    # Errors are always logged. `0` and `1` log errors only, `2` adds warnings and messages, `3` adds info, and `4` adds debug logs.
    # HAMi-core itself defaults to `2` when the variable is unset.
    # Not applied in the `mig` operating mode. A device-plugin `nodeconfig` entry can override it per node with `libcudaloglevel`.
    libCudaLogLevel: 1
    # -- How the device plugin passes a container's GPU limits to HAMi-core.
    # `file` sets the limit environment variables and also mounts the limits read-only at `/overrideEnv`,
    # so HAMi-core can apply them to processes started without the container's environment, such as from SSH, `su -`, `sudo` or cron.
    # `env` sets the environment variables only.
    # A device-plugin `nodeconfig` entry can override it per node with `limitdelivery`, and a Pod with the `hami.io/limit-delivery` annotation.
    # An unknown value is ignored, and `file` is used when no valid value is set. Not applied in the `mig` operating mode.
    limitDelivery: file
  remotegpu:
    # Schedule pods onto GPUs served over the network by a lupine server.
    # Mark lupine nodes with operatingmode: remote in devicePlugin.nodeConfiguration
    # (peer to hami-core / mig). The device plugin applies hami.io/lupine-server;
    # set that label's value to a custom port only when the server is managed
    # outside the chart (empty value uses defaultPort below).
    enabled: false
    defaultPort: 14833
    resourceCountName: "nvidia.com/remote-gpu"
    resourceMemoryName: "nvidia.com/remote-gpu-memory"
    # -- HAMi-core image for remote GPU memory enforcement; unset uses the device plugin image, empty disables enforcement.
    # An init container copies HAMi-core into the client Pod.
    # A client node runs no device plugin, so nothing else would deliver it.
    # Leave it unset for the device plugin image. Set it to "" to schedule
    # remote GPUs without enforcement.
    libImage:
    # -- Client image used to deliver Lupine libraries and libnghttp2 for the CUDA/vLLM examples; empty disables delivery.
    # Match the server version and workload ABI; an empty string disables delivery.
    clientImage: "ghcr.io/lupinemachines/lupine-client:cuda-13.3.1-ubuntu24.04"
    # Image for the session stub the scheduler keeps on each lupine server, so
    # a user port-forwards to the stub instead of the server. Needs socat on
    # the path. Empty runs no stubs, and no port-forward sessions with them.
    sessionImage: ""
    server:
      # Run a lupine server on every lupine node that leaves its label value
      # empty. The chart-managed server listens on defaultPort, because a
      # DaemonSet cannot vary a port per node, so a node whose label names its
      # own port is left to a server managed outside the chart.
      enabled: true
      image:
        registry: "ghcr.io"
        repository: "lupinemachines/lupine-server"
        tag: "cuda-13.3.1-ubuntu24.04"
        pullPolicy: IfNotPresent
      # The server reaches the GPUs through NVIDIA_VISIBLE_DEVICES, which only
      # works under the NVIDIA container runtime. Name the RuntimeClass that
      # selects it when the cluster does not make it the default, commonly
      # "nvidia". It has its own setting rather than borrowing the device
      # plugin's: in remote mode that plugin still runs, but only publishes the
      # fleet annotation and does not need the NVIDIA runtime itself.
      runtimeClassName: ""
      tolerations: []
      resources: {}
  ascend:
    configs:
