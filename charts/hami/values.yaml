    resourceCountName: "hygon.com/hcunum"
    # devices.hygon.resourceMemoryName -- Kubernetes extended-resource name for device memory.
    resourceMemoryName: "hygon.com/hcumem"
    # devices.hygon.resourceCoreName -- Kubernetes extended-resource name for device cores.
    resourceCoreName: "hygon.com/hcucores"
  cambricon:
    # devices.cambricon.resourceCountName -- Kubernetes extended-resource name for device count.
    resourceCountName: "cambricon.com/vmlu"
    # devices.cambricon.resourceMemoryName -- Kubernetes extended-resource name for device memory.
    resourceMemoryName: "cambricon.com/mlu.smlu.vmemory"
    # devices.cambricon.resourceCoreName -- Kubernetes extended-resource name for device cores.
    resourceCoreName: "cambricon.com/mlu.smlu.vcore"
  amd:
    # devices.amd.resourceCountName -- Kubernetes extended-resource name for device count.
    resourceCountName: "amd.com/gpu"
    # devices.amd.resourceMemoryName -- Kubernetes extended-resource name for device memory.
    resourceMemoryName: "amd.com/gpumem"
    # devices.amd.resourceCoreName -- Kubernetes extended-resource name for device cores.
    resourceCoreName: "amd.com/gpucores"
    # devices.amd.customresources -- Resource names forwarded to the scheduler extender for this vendor; update this list when changing its runtime resource names.
    customresources:
