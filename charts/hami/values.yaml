      - amd.com/gpumem
      - amd.com/gpucores
  awsneuron:
    # devices.awsneuron.resourceCountName -- Kubernetes extended-resource name for device count.
    resourceCountName: "aws.amazon.com/neuron"
    # devices.awsneuron.resourceCoreName -- Kubernetes extended-resource name for device cores.
    resourceCoreName: "aws.amazon.com/neuroncore"
    # devices.awsneuron.customresources -- Resource names forwarded to the scheduler extender for this vendor; update this list when changing its runtime resource names.
    customresources:
      - aws.amazon.com/neuron
      - aws.amazon.com/neuroncore
  kunlun:
    # devices.kunlun.resourceCountName -- Kubernetes extended-resource name for device count.
    resourceCountName: "kunlunxin.com/xpu"
    # devices.kunlun.resourceVCountName -- Kubernetes extended-resource name for virtual-device count.
    resourceVCountName: "kunlunxin.com/vxpu"
    # devices.kunlun.resourceVMemoryName -- Kubernetes extended-resource name for virtual-device memory.
    resourceVMemoryName: "kunlunxin.com/vxpu-memory"
    # devices.kunlun.enabled -- Whether to enable
    enabled: true
    # devices.kunlun.customresources -- Additional resource names forwarded to the scheduler extender; standard resources are added automatically from the named resource fields.
    customresources: []
  enflame:
    # devices.enflame.resourceNameGCU -- Kubernetes extended-resource name for physical Enflame GCU count.
    resourceNameGCU: "enflame.com/gcu"
    # devices.enflame.resourceNameDRSGCU -- Kubernetes extended-resource name for Enflame DRS GCU count.
    resourceNameDRSGCU: "enflame.com/drs-gcu"
    # devices.enflame.resourceNameGCUMemory -- Kubernetes extended-resource name for Enflame GCU memory.
    resourceNameGCUMemory: "enflame.com/gcu-memory"
    # devices.enflame.resourceNameGCUCore -- Kubernetes extended-resource name for Enflame GCU cores.
    resourceNameGCUCore: "enflame.com/gcu-core"
    # devices.enflame.enabled -- Enable this optional chart feature.
    enabled: true
    # devices.enflame.customresources -- Additional resource names forwarded to the scheduler extender; standard resources are added automatically from the named resource fields.
    customresources: []
  mthreads:
    # devices.mthreads.enabled -- Whether to enable
    enabled: true
    # devices.mthreads.customresources -- Resource names forwarded to the scheduler extender for this vendor; update this list when changing its runtime resource names.
    customresources:
      - mthreads.com/vgpu
    # devices.mthreads.resourceCountName -- Kubernetes extended-resource name for device count.
    resourceCountName: "mthreads.com/vgpu"
    # devices.mthreads.resourceMemoryName -- Kubernetes extended-resource name for device memory.
    resourceMemoryName: "mthreads.com/sgpu-memory"
    # devices.mthreads.resourceCoreName -- Kubernetes extended-resource name for device cores.
    resourceCoreName: "mthreads.com/sgpu-core"
    # Memory units (512MiB each) provided by one MThreads card model, one entry per
    # model present in the cluster. 96 = MTT S4000 (48GiB, upstream default);
    # 160 = MTT S5000 (80GiB). Mixed fleets list every model, e.g. [96, 160].
    # List of integer memory units of 512 MiB per card model.
    # Pods that omit mthreads.com/sgpu-memory are sized from the node's real card.

    # devices.mthreads.memoryPerCard -- List of integer memory units of 512 MiB per MThreads card model; list every model in mixed fleets. 96 represents 48 GiB and 160 represents 80 GiB. Legacy scalar values are rendered as a one-item list.
    memoryPerCard:
      - 96
  vastai:
    # devices.vastai.resourceCountName -- Kubernetes extended-resource name for device count.
    resourceCountName: "vastaitech.com/va"
    # devices.vastai.enabled -- Enable this optional chart feature.
    enabled: true
    # devices.vastai.customresources -- Additional resource names forwarded to the scheduler extender; standard resources are added automatically from the named resource fields.
    customresources: []
  biren:
    # devices.biren.resourceCountName -- Kubernetes extended-resource name for device count.
    resourceCountName: "birentech.com/gpu"
    # devices.biren.enabled -- Enable this optional chart feature.
    enabled: true
    # devices.biren.customresources -- Additional resource names forwarded to the scheduler extender; standard resources are added automatically from the named resource fields.
    customresources: []
  nvidia:
    # devices.nvidia.migProfileAllowlist -- Allowed MIG profiles by GPU model. Each entry contains models and profiles lists; an override replaces the complete default list.
    # @default -- See the complete list in [values.yaml](values.yaml).
    migProfileAllowlist:
      - models: [ "A30" ]
        profiles: [ "1g.6gb", "2g.12gb", "4g.24gb" ]
      - models: [ "A100-SXM4-40GB", "A100-40GB-PCIe", "A100-PCIE-40GB"]
        profiles: [ "1g.5gb", "2g.10gb", "3g.20gb", "4g.20gb", "7g.40gb" ]
      - models: [ "A100-SXM4-80GB", "A100-80GB-PCIe", "A100-PCIE-80GB"]
        profiles: [ "1g.10gb", "2g.20gb", "3g.40gb", "4g.40gb", "7g.79gb" ]
      - models: [ "H100-PCIE-80GB", "H100-SXM5-80GB"]
        profiles: [ "1g.10gb", "2g.20gb", "3g.40gb", "4g.40gb", "7g.80gb" ]
      - models: [ "H100-PCIE-94GB", "H100-SXM5-94GB"]
        profiles: [ "1g.12gb", "2g.24gb", "3g.47gb", "4g.47gb", "7g.94gb" ]
      - models: [ "H20", "H100 on GH200"]
        profiles: [ "1g.12gb", "2g.24gb", "3g.48gb", "4g.48gb", "7g.96gb" ]
      - models: [ "H200 NVL", "H200-SXM5"]
        profiles: [ "1g.18gb", "2g.35gb", "3g.71gb", "4g.71gb", "7g.141gb" ]
      - models: [ "B200" ]
        profiles: [ "1g.23gb", "2g.45gb", "3g.90gb", "4g.90gb", "7g.180gb" ]
      - models: [ "RTX PRO 6000 Blackwell Server Edition" ]
        profiles: [ "1g.24gb", "2g.48gb", "4g.96gb" ]
    # devices.nvidia.defaultMemory -- Fallback memory allocation in MiB when neither absolute nor percentage memory is requested; 0 uses the full GPU memory.
    defaultMemory: 0
    # devices.nvidia.defaultCores -- Fallback GPU-core percentage when no core request is provided; 0 leaves core usage unconstrained.
    defaultCores: 0
    # devices.nvidia.defaultGPUNum -- GPU count injected when a Pod requests NVIDIA memory or cores without a GPU count.
    defaultGPUNum: 1
    # devices.nvidia.memoryFactor -- Memory-unit multiplier used by this device backend when translating memory requests.
    memoryFactor: 1
    # devices.nvidia.resourceCountName -- Kubernetes extended-resource name for device count.
    resourceCountName: "nvidia.com/gpu"
    # devices.nvidia.resourceMemoryName -- Kubernetes extended-resource name for device memory.
    resourceMemoryName: "nvidia.com/gpumem"
    # devices.nvidia.resourceMemoryPercentageName -- Kubernetes extended-resource name for NVIDIA memory percentage requests.
    resourceMemoryPercentageName: "nvidia.com/gpumem-percentage"
    # devices.nvidia.resourceCoreName -- Kubernetes extended-resource name for device cores.
    resourceCoreName: "nvidia.com/gpucores"
    # devices.nvidia.resourcePriorityName -- Kubernetes extended-resource name for NVIDIA allocation priority.
    resourcePriorityName: "nvidia.com/priority"
    # devices.nvidia.deviceSplitCount -- Maximum virtual-device count advertised per physical NVIDIA GPU; per-node configuration can override it.
    deviceSplitCount: 10
    # devices.nvidia.deviceMemoryScaling -- Ratio used to scale advertised NVIDIA GPU memory; per-node configuration can override it.
    deviceMemoryScaling: 1
    # devices.nvidia.deviceCoreScaling -- Ratio used to scale advertised NVIDIA GPU cores; per-node configuration can override it.
    deviceCoreScaling: 1
    # Memory in MB for GPUs without memory queries; 0 uses auto-detection.
    # The node configuration can override this for unified-memory GPUs.

    # devices.nvidia.preConfiguredDeviceMemory -- Memory in MB for GPUs without memory queries; 0 uses auto-detection. Per-node configuration can override it.
    preConfiguredDeviceMemory: 0
    # Advertise the GPU's NUMA node to kubelet's TopologyManager.
    # Opt-in because single-numa-node policy changes admission behavior.

    # devices.nvidia.enableNumaTopology -- Advertise physical GPU NUMA topology to kubelet; enabling it can affect TopologyManager admission.
    enableNumaTopology: false
    # devices.nvidia.runtimeClassName -- RuntimeClass used by the NVIDIA device-plugin Pod and injected into NVIDIA workload Pods.
    runtimeClassName: ""
    # devices.nvidia.createRuntimeClass -- Create the NVIDIA RuntimeClass named by devices.nvidia.runtimeClassName when the device plugin is enabled.
    createRuntimeClass: false
    # devices.nvidia.gpuCorePolicy -- HAMi-core GPU-core utilization policy: default, force, or disable.
    gpuCorePolicy: default
    # devices.nvidia.libCudaLogLevel -- HAMi-core CUDA log level: 0 errors, 1 warnings, 3 information, or 4 debug.
    libCudaLogLevel: 1
  remotegpu:
    # Schedule pods onto GPUs served over the network by a lupine server.
    # Label each lupine node with hami.io/lupine-server, optionally setting the
    # label value to the port lupine listens on.

    # devices.remotegpu.enabled -- Enable scheduling for Remote GPU resources served by lupine.
    enabled: false
    # devices.remotegpu.defaultPort -- Lupine server port used when the server node label does not specify a port; also used by the chart-managed server.
    defaultPort: 14833
    # devices.remotegpu.resourceCountName -- Kubernetes extended-resource name for device count.
    resourceCountName: "nvidia.com/remote-gpu"
    # devices.remotegpu.resourceMemoryName -- Kubernetes extended-resource name for device memory.
    resourceMemoryName: "nvidia.com/remote-gpu-memory"
    # Image carrying HAMi-core, which an init container copies into the client
    # pod so the memory request is enforced and not merely a placement filter.
    # A client node runs no device plugin, so nothing else would deliver it.
    # Leave it unset for the device plugin image. Set it to "" to schedule
    # remote GPUs without enforcement.

    # devices.remotegpu.libImage -- (string) Image supplying HAMi-core to Remote GPU clients. null derives the device-plugin image; an empty string disables client enforcement.
    libImage:
    # Image for the session stub the scheduler keeps on each lupine server, so
    # a user port-forwards to the stub instead of the server. Needs socat on
    # the path. Empty runs no stubs, and no port-forward sessions with them.

    # devices.remotegpu.sessionImage -- Image for server session relay Pods; empty disables session relays. The image must provide socat.
    sessionImage: ""
    server:
      # Run a lupine server on every lupine node that leaves its label value
      # empty. The chart-managed server listens on defaultPort, because a
      # DaemonSet cannot vary a port per node, so a node whose label names its
      # own port is left to a server managed outside the chart.

      # devices.remotegpu.server.enabled -- Run a lupine server on labelled nodes whose hami.io/lupine-server label value is empty.
      enabled: true
      image:
        # devices.remotegpu.server.image.registry -- Container image registry; global.imageRegistry takes priority when set.
        registry: "ghcr.io"
        # devices.remotegpu.server.image.repository -- Container image repository name.
        repository: "lupinemachines/lupine-server"
        # devices.remotegpu.server.image.tag -- Container image tag.
        tag: "cuda-13.3.1-ubuntu24.04"
        # devices.remotegpu.server.image.pullPolicy -- Kubernetes container image pull policy.
        pullPolicy: IfNotPresent
      # The server reaches the GPUs through NVIDIA_VISIBLE_DEVICES, which only
      # works under the NVIDIA container runtime. Name the RuntimeClass that
      # selects it when the cluster does not make it the default, commonly
      # "nvidia". It has its own setting rather than borrowing the device
      # plugin's, because in remote mode that plugin may not run at all.

      # devices.remotegpu.server.runtimeClassName -- RuntimeClass selecting the NVIDIA container runtime for the chart-managed lupine server.
      runtimeClassName: ""
      # devices.remotegpu.server.tolerations -- Kubernetes Pod tolerations for node taints.
      tolerations: []
      # devices.remotegpu.server.resources -- Kubernetes CPU and memory requests and limits for the container.
      resources: {}
