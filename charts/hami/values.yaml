## @section Global configuration
global:
  ## @param global.imageRegistry Global Docker image registry
  imageRegistry: ""
  ## E.g.
  ## imagePullSecrets:
  ##   - myRegistryKeySecretName
  ## @param global.imagePullSecrets Global Docker image pull secrets
  imagePullSecrets: []
  ## @skip global.imageTag
  imageTag: "v2.10.0"
  ## @skip global.gpuHookPath
  gpuHookPath: /usr/local
  ## @skip global.labels
  labels: {}
  ## @skip global.annotations
  annotations: {}
  ## @skip global.managedNodeSelectorEnable
  managedNodeSelectorEnable: false
  ## @skip global.managedNodeSelector
  managedNodeSelector:
    usage: "gpu"

## @skip nameOverride
nameOverride: ""
## @skip fullnameOverride
fullnameOverride: ""
## @skip namespaceOverride
namespaceOverride: ""

## @skip platform
platform:
  openshift: false

## @section OpenShift configuration
openshift:
  securityContextConstraints:
    ## @param openshift.securityContextConstraints.create Create the named device-plugin SCC and its use ClusterRole when OpenShift support is enabled. Set this to false only when both the SCC and `system:openshift:scc:<name>` ClusterRole already exist, such as for the built-in `privileged` SCC.
    create: true

    ## @param openshift.securityContextConstraints.name SCC granted to enabled device-plugin service accounts. When `create=false`, the matching `system:openshift:scc:<name>` ClusterRole must already exist. The built-in `privileged` SCC requires `create=false`.
    name: "hami-device-plugin"

# SELinux relabeling is available on any SELinux-enabled Kubernetes distribution.
## @skip selinux
selinux:
  enabled: false
  type: container_file_t
  level: s0

## @skip schedulerName
schedulerName: "hami-scheduler"

## @skip podSecurityPolicy
podSecurityPolicy:
  enabled: false

## @section Scheduler configuration
scheduler:
  ## @param scheduler.nodeName Node name on which to run the scheduler Pod.
  # if we install the nvidia-vgpu-scheduler-scheduler as default scheduler, we need to remove the k8s default
  # scheduler pod from the cluster first, we must specify node name to skip the schedule workflow.
  nodeName: ""
  #nodeLabelSelector:
  #  "gpu": "on"
  ## @skip scheduler.overwriteEnv
  overwriteEnv: "false"
  ## @skip scheduler.defaultSchedulerPolicy
  defaultSchedulerPolicy:
    nodeSchedulerPolicy: binpack
    gpuSchedulerPolicy: spread
  ## @skip scheduler.metricsBindAddress
  metricsBindAddress: ":9395"
  # Only used when --profiling is enabled in scheduler.extender.extraArgs.
  # Keep loopback binding and use kubectl port-forward to access pprof.
  ## @skip scheduler.profilingBindAddress
  profilingBindAddress: "127.0.0.1:6060"
  # Client-side rate limiting and timeout for the scheduler's connection to the kube-apiserver.
  # Leave empty to keep the binary defaults (QPS 5, burst 10, no timeout). Raising kubeQPS and
  # kubeBurst helps on large clusters, where node registration patches and per-pod annotation
  # writes can be throttled by the default limits.
  ## @skip scheduler.kubeQPS
  kubeQPS: ""
  ## @skip scheduler.kubeBurst
  kubeBurst: ""
  # kubeTimeout is in seconds; 0 means no timeout.
  ## @skip scheduler.kubeTimeout
  kubeTimeout: ""
  # How long Bind retries LockNode when another PodGroup member holds the node
  # lock. Empty keeps the binary default (28s); 0 disables retry entirely.
  ## @skip scheduler.nodeLockRetryTimeout
  nodeLockRetryTimeout: ""
  # httpTimeout the generated scheduler configuration gives the HAMi extender, in
  # seconds. It is applied to the KubeSchedulerConfiguration used on Kubernetes
  # 1.22+ and to the legacy Policy format used below it, which is why it is
  # expressed in seconds rather than as a duration: the two formats want
  # different units. Keep it above nodeLockRetryTimeout, otherwise kube-scheduler
  # cuts the bind call off while the extender is still retrying the node lock.
  ## @skip scheduler.extenderHTTPTimeout
  extenderHTTPTimeout: 30
  # Port the extender serves /filter and /bind on, bound to 127.0.0.1 so only
  # the kube-scheduler container sharing this pod's network namespace can call
  # them. It is deliberately not the port the Service publishes: that one also
  # carries /webhook and /refit, which must stay reachable from the cluster,
  # and /filter and /bind have no caller authentication of their own. Change
  # this only if 9444 is already taken inside the pod; if you run kube-scheduler
  # outside this pod, override the bind address through
  # scheduler.extender.extraArgs instead.
  ## @skip scheduler.extenderPort
  extenderPort: 9444
  # If set to false, When Pod.Spec.SchedulerName equals to the const DefaultSchedulerName in k8s.io/api/core/v1 package, webhook will not overwrite it
  ## @skip scheduler.forceOverwriteDefaultScheduler
  forceOverwriteDefaultScheduler: true
  ## @skip scheduler.livenessProbe
  livenessProbe: false
  ## @skip scheduler.leaderElect
  leaderElect: true
  # when leaderElect is true, replicas is available, otherwise replicas is 1.
  ## @skip scheduler.replicas
  replicas: 1
  # podDisruptionBudget only renders when leaderElect is true and replicas > 1;
  # with a single replica it would block all voluntary node drains.
  ## @skip scheduler.podDisruptionBudget
  podDisruptionBudget:
    minAvailable: 1
    # maxUnavailable: 1
  kubeScheduler:
    ## @param scheduler.kubeScheduler.enabled Run the kube-scheduler container in the scheduler Pod.
    enabled: true
    ## @param scheduler.kubeScheduler.image.registry kube scheduler image registry
    ## @param scheduler.kubeScheduler.image.repository kube scheduler image repository
    ## @param scheduler.kubeScheduler.image.tag kube scheduler image tag (immutable tags are recommended)
    ## @param scheduler.kubeScheduler.image.pullPolicy kube scheduler image pull policy
    ## @param scheduler.kubeScheduler.image.pullSecrets Specify docker-registry secret names as an array
    image:
      registry: "registry.cn-hangzhou.aliyuncs.com"
      repository: "google_containers/kube-scheduler"
      tag: ""
      ## Specify a imagePullPolicy
      ## Defaults to 'Always' if image tag is 'latest', else set to 'IfNotPresent'
      ## ref: https://kubernetes.io/docs/user-guide/images/#pre-pulling-images
      ##
      pullPolicy: IfNotPresent
      ## Optionally specify an array of imagePullSecrets.
      ## Secrets must be manually created in the namespace.
      ## Example:
      ## pullSecrets:
      ##   - myRegistryKeySecretName
      ##
      pullSecrets: []
    ## @skip scheduler.kubeScheduler.resources
    resources: {}
      # If you do want to specify resources, uncomment the following lines, adjust them as necessary.
      # and remove the curly braces after 'resources:'.
#      limits:
#        cpu: 1000m
#        memory: 1000Mi
#      requests:
#        cpu: 100m
#        memory: 100Mi
    ## @skip scheduler.kubeScheduler.extraNewArgs
    extraNewArgs:
      - --config=/config/config.yaml
      - -v=4
    ## @skip scheduler.kubeScheduler.extraArgs
    extraArgs:
      - --policy-config-file=/config/config.json
      - -v=4
  extender:
    ## @param scheduler.extender.image.registry scheduler extender image registry
    ## @param scheduler.extender.image.repository scheduler extender image repository
    ## @param scheduler.extender.image.tag scheduler extender image tag (immutable tags are recommended)
    ## @param scheduler.extender.image.pullPolicy scheduler extender image pull policy
    ## @param scheduler.extender.image.pullSecrets Specify docker-registry secret names as an array
    image:
      registry: "docker.io"
      repository: "projecthami/hami"
      tag: ""
      ## Specify a imagePullPolicy
      ## Defaults to 'Always' if image tag is 'latest', else set to 'IfNotPresent'
      ## ref: https://kubernetes.io/docs/user-guide/images/#pre-pulling-images
      ##
      pullPolicy: IfNotPresent
      ## Optionally specify an array of imagePullSecrets.
      ## Secrets must be manually created in the namespace.
      ## Example:
      ## pullSecrets:
      ##   - myRegistryKeySecretName
      ##
      pullSecrets: []
    ## @skip scheduler.extender.resources
    resources: {}
      # If you do want to specify resources, uncomment the following lines, adjust them as necessary,
      # and remove the curly braces after 'resources:'.
#      limits:
#        cpu: 1000m
#        memory: 1000Mi
#      requests:
#        cpu: 100m
#        memory: 100Mi
    ## @skip scheduler.extender.extraArgs
    extraArgs:
      - --debug
      - -v=4
  ## @skip scheduler.nodeLockExpire
  nodeLockExpire: "5m"
  ## @skip scheduler.podAnnotations
  podAnnotations: {}
  ## @skip scheduler.tolerations
  tolerations: []
  #serviceAccountName: "hami-vgpu-scheduler-sa"
  ## @skip scheduler.admissionWebhook
  admissionWebhook:
    # If set to false, the admission webhook is not installed and any pods that should use HAMi must be
    # configured to use the right 'schedulerName' and other device-specific configurations.
    enabled: true
    customURL:
      enabled: false
      # must be an endpoint using https.
      # should generate host certs here
      host: 127.0.0.1 # hostname or ip, can be your node'IP if you want to use https://<nodeIP>:<schedulerPort>/<path>
      port: 31998
      path: /webhook
    whitelistNamespaces:
    # Specify the namespaces that the webhook will not be applied to.
      # - default
      # - kube-system
      # - istio-system
    # manageNamespaceSelector controls whether the chart renders and manages the webhook's
    # namespaceSelector field. Keep it true on standard Kubernetes clusters.
    # Set it to false on managed platforms (e.g. AKS) where the platform mutates and owns
    # the namespaceSelector field, to avoid server-side apply ownership conflicts.
    manageNamespaceSelector: true
    # namespaceSelector controls which namespaces the webhook will be applied to.
    # The default matchExpressions exclude namespaces with label "hami.io/webhook: ignore".
    # You can add additional matchLabels or matchExpressions to further filter namespaces.
    namespaceSelector:
      matchLabels:
        # app.kubernetes.io/part-of: kubeflow-profile
      matchExpressions: []
      # Example: exclude namespaces with specific labels
      # - key: environment
      #   operator: In
      #   values:
      #   - development
      #   - staging
    # objectSelector controls which pods the webhook will be applied to.
    # The default matchExpressions exclude pods with label "hami.io/webhook: ignore".
    # You can add additional matchLabels or matchExpressions to further filter pods.
    objectSelector:
      # matchLabels:
      #   app.kubernetes.io/managed-by: hami
      matchExpressions: []
      # Example: only apply to pods with specific labels
      # - key: hami.io/enable
      #   operator: In
      #   values:
      #   - "true"
    reinvocationPolicy: Never
    failurePolicy: Ignore
  ## TLS Certificate Option 1: Use cert-manager to generate self-signed certificate.
  ## If enabled, always takes precedence over options 2.
  ## @skip scheduler.certManager
  certManager:
    enabled: false
  ## TLS Certificate Option 2: Use kube-webhook-certgen to generate self-signed certificate.
  ## If true and certManager.enabled is false, Helm will automatically create a self-signed cert and secret for you.
  patch:
    ## @skip scheduler.patch.enabled
    enabled: true
    ## @param scheduler.patch.image.registry webhook certificate generator image registry
    ## @param scheduler.patch.image.repository webhook certificate generator image repository
    ## @param scheduler.patch.image.tag webhook certificate generator image tag (immutable tags are recommended)
    ## @param scheduler.patch.image.pullPolicy webhook certificate generator image pull policy
    ## @param scheduler.patch.image.pullSecrets Specify docker-registry secret names as an array
    image:
      registry: "docker.io"
      repository: "jettech/kube-webhook-certgen"
      tag: "v1.5.2"
      ## Specify a imagePullPolicy
      ## Defaults to 'Always' if image tag is 'latest', else set to 'IfNotPresent'
      ## ref: https://kubernetes.io/docs/user-guide/images/#pre-pulling-images
      ##
      pullPolicy: IfNotPresent
      ## Optionally specify an array of imagePullSecrets.
      ## Secrets must be manually created in the namespace.
      ## Example:
      ## pullSecrets:
      ##   - myRegistryKeySecretName
      ##
      pullSecrets: []
    ## @param scheduler.patch.imageNew.registry webhook certificate generator image registry
    ## @param scheduler.patch.imageNew.repository webhook certificate generator image repository
    ## @param scheduler.patch.imageNew.tag webhook certificate generator image tag (immutable tags are recommended)
    ## @param scheduler.patch.imageNew.pullPolicy webhook certificate generator image pull policy
    ## @param scheduler.patch.imageNew.pullSecrets Specify docker-registry secret names as an array
    imageNew: 
      registry: "docker.io"
      repository: "liangjw/kube-webhook-certgen"
      tag: "v1.1.1"
      ## Specify a imagePullPolicy
      ## Defaults to 'Always' if image tag is 'latest', else set to 'IfNotPresent'
      ## ref: https://kubernetes.io/docs/user-guide/images/#pre-pulling-images
      ##
      pullPolicy: IfNotPresent
      ## Optionally specify an array of imagePullSecrets.
      ## Secrets must be manually created in the namespace.
      ## Example:
      ## pullSecrets:
      ##   - myRegistryKeySecretName
      ##
      pullSecrets: []
    ## @skip scheduler.patch.priorityClassName
    priorityClassName: ""
    ## @skip scheduler.patch.podAnnotations
    podAnnotations: {}
    ## @skip scheduler.patch.nodeSelector
    nodeSelector: {}
    ## @skip scheduler.patch.tolerations
    tolerations: []
    # OpenShift omits this value at render time so its SCC can allocate an allowed UID.
    ## @skip scheduler.patch.runAsUser
    runAsUser: 2000
  ## @skip scheduler.service
  service:
    type: ClusterIP  # Default type is ClusterIP, can be changed to NodePort
    httpPort: 443   # HTTP port
    schedulerPort: 31998  # NodePort for HTTP
    monitorPort: 31993    # Monitoring port
    monitorTargetPort: metrics  # Name of the container port, so it follows scheduler.metricsBindAddress
    httpTargetPort: 9443
    labels: {}
    annotations: {}
  ## @skip scheduler.networkPolicy
  networkPolicy:
    # Restrict ingress on the scheduler's HTTP port (refit and webhook share
    # this one port -- NetworkPolicy can't separate them by path; filter and
    # bind are not on it, they are served on scheduler.extenderPort, bound to
    # loopback) to the device-plugin's pods and to the kube-system namespace, where
    # kube-scheduler and kube-apiserver normally run. See issue #2878.
    #
    # Off by default: /refit's own caller authentication (TokenReview) does
    # not depend on this and is unaffected either way -- this is only an
    # extra layer on top. Enable it only after confirming your CNI actually
    # matches kube-apiserver traffic against namespaceSelector/podSelector.
    # When kube-apiserver runs as a hostNetwork pod (the kubeadm/most on-prem
    # default), Kubernetes documents NetworkPolicy behavior for hostNetwork
    # pods as undefined, and it is known not to match on at least Calico
    # (projectcalico/calico#1987) and Cilium (which requires its separate
    # Host Firewall feature for host-network traffic). If this policy blocks
    # kube-apiserver's calls to /webhook, admissionWebhook.failurePolicy:
    # Ignore lets pod admission continue with HAMi's mutation silently
    # skipped -- pods can then be scheduled by the default scheduler with no
    # GPU device allocated and no error surfaced.
    enabled: false

## @section Device plugin configuration
devicePlugin:
  ## @skip devicePlugin.enabled
  enabled: true
  ## @skip devicePlugin.gpuOperatorToolkitReady
  gpuOperatorToolkitReady:
    enabled: false
    hostPath: "/run/nvidia/validations"
    securityContext:
      privileged: true
      runAsUser: 0
  ## @param devicePlugin.image.registry devicePlugin image registry
  ## @param devicePlugin.image.repository devicePlugin image repository
  ## @param devicePlugin.image.tag devicePlugin image tag (immutable tags are recommended)
  ## @param devicePlugin.image.pullPolicy devicePlugin image pull policy
  ## @param devicePlugin.image.pullSecrets Specify docker-registry secret names as an array
  image:
    registry: "docker.io"
    repository: "projecthami/hami"
    tag: ""
    ## Specify a imagePullPolicy
    ## Defaults to 'Always' if image tag is 'latest', else set to 'IfNotPresent'
    ## ref: https://kubernetes.io/docs/user-guide/images/#pre-pulling-images
    ##
    pullPolicy: IfNotPresent
    ## Optionally specify an array of imagePullSecrets.
    ## Secrets must be manually created in the namespace.
    ## Example:
    ## pullSecrets:
    ##   - myRegistryKeySecretName
    ##
    pullSecrets: []
  vgpuCache:
    ## @param devicePlugin.vgpuCache.gracePeriod Minimum directory age before stale cache GC.
    # Independent of monitor.resyncInterval. Uses Go duration syntax (e.g. "5m").
    # "0s" removes the grace period, but still requires live Pod confirmation.
    # Negative durations are rejected; invalid duration strings fall back to "5m".
    gracePeriod: "5m"
  monitor:
    ## @param devicePlugin.monitor.image.registry monitor image registry
    ## @param devicePlugin.monitor.image.repository monitor image repository
    ## @param devicePlugin.monitor.image.tag monitor image tag (immutable tags are recommended)
    ## @param devicePlugin.monitor.image.pullPolicy monitor image pull policy
    ## @param devicePlugin.monitor.image.pullSecrets Specify docker-registry secret names as an array
    image:
      registry: "docker.io"
      repository: "projecthami/hami"
      tag: ""
      ## Specify a imagePullPolicy
      ## Defaults to 'Always' if image tag is 'latest', else set to 'IfNotPresent'
      ## ref: https://kubernetes.io/docs/user-guide/images/#pre-pulling-images
      ##
      pullPolicy: IfNotPresent
      ## Optionally specify an array of imagePullSecrets.
      ## Secrets must be manually created in the namespace.
      ## Example:
      ## pullSecrets:
      ##   - myRegistryKeySecretName
      ##
      pullSecrets: []
    ## @skip devicePlugin.monitor.ctrPath
    ctrPath: /usr/local/vgpu/containers
    # Monitor Pod informer resync and grace period for releasing mappings of missing Pods.
    # Does not control directory GC or Prometheus scrape frequency.
    ## @skip devicePlugin.monitor.resyncInterval
    resyncInterval: "5m"
    ## @skip devicePlugin.monitor.extraArgs
    extraArgs:
      - -v=4
    ## @skip devicePlugin.monitor.extraEnvs
    extraEnvs: {}
    ## @skip devicePlugin.monitor.securityContext
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
        add: ["SYS_ADMIN"]
    ## @skip devicePlugin.monitor.resources
    resources: {}
      # If you do want to specify resources, uncomment the following lines, adjust them as necessary.
      # and remove the curly braces after 'resources:'.
#      limits:
#        cpu: 1000m
#        memory: 1000Mi
#      requests:
#        cpu: 100m
#        memory: 100Mi

  # NUMA alignment refit (#2080): when enabled, the device plugin asks the
  # scheduler to re-run its fit over the NUMA-restricted device set kubelet
  # allows, keeping scheduler accounting authoritative. Requires
  # devices.nvidia.enableNumaTopology plus the per-node enablegetpreferredallocation node
  # configuration; pods opt in with the hami.io/numa-alignment annotation
  # (best-effort or strict). Disabled by default: mismatches are only logged.
  ## @skip devicePlugin.numaRefit
  numaRefit:
    enabled: false
    # Scheduler base URL override. Defaults to the in-cluster scheduler
    # service, https://<release>-scheduler.<namespace>.svc:<httpPort>.
    schedulerEndpoint: ""
    # The scheduler serves the admission webhook's self-signed certificate,
    # so verification is skipped by default with the same posture as the
    # extender configmap (tlsConfig.insecure). Set false to verify, and use
    # caFile to point at a CA bundle mounted into the device plugin.
    tlsInsecure: true
    # Path to a CA bundle already present inside the device-plugin container.
    caFile: ""
    # Name of a Secret (key ca.crt) to mount as the CA bundle instead; used
    # when caFile is empty.
    caSecret: ""
  # Report GPU memory and core resources (e.g. nvidia.com/gpumem, nvidia.com/gpucores)
  # to Node capacity and allocatable fields. Defaults to false. Not NVIDIA-specific,
  # so this stays here rather than under devices.<vendor>.
  ## @skip devicePlugin.reportNodeCapacity
  reportNodeCapacity: false
  # Node configuration for device plugin, Priority: externalConfigName > config > default config
  ## @skip devicePlugin.nodeConfiguration
  nodeConfiguration:
    # If you want to use a custom config.json, you can set the content here.
    # If this is set, it will override the default config.json(An example is as follows).
    config: |
      {
        "nodeconfig": [
          {
            "name": "your-node-name",
            "operatingmode": "hami-core",
            "devicememoryscaling": 1,
            "devicesplitcount": 10,
            "preconfigureddevicememory": 0,
            "enablenumatopology": false,
            "migstrategy": "none",
            "filterdevices": {
              "uuid": [],
              "index": []
            },
            "enablegetpreferredallocation": false
          }
        ]
      }
    # If you want to use an existing ConfigMap, you can set the name here.
    # If this is set, the chart will not create the ConfigMap and will use the existing one.
    externalConfigName: ""
  ## @skip devicePlugin.migStrategy
  migStrategy: "none"
  ## @skip devicePlugin.disablecorelimit
  disablecorelimit: "false"
  ## @skip devicePlugin.passDeviceSpecsEnabled
  passDeviceSpecsEnabled: true
  ## @skip devicePlugin.deviceListStrategy
  deviceListStrategy: "envvar"
  ## @skip devicePlugin.nvidiaHookPath
  nvidiaHookPath: null
  # Root of the NVIDIA driver on the host. Set to "auto" to read the driver
  # and device roots from GPU Operator's driver-ready contract. If the
  # contract is absent, both roots default to / for a host-installed driver.
  ## @skip devicePlugin.nvidiaDriverRoot
  nvidiaDriverRoot: "auto"
  ## @skip devicePlugin.gdrcopyEnabled
  gdrcopyEnabled: null
  ## @skip devicePlugin.gdsEnabled
  gdsEnabled: null
  ## @skip devicePlugin.mofedEnabled
  mofedEnabled: null

  ## @skip devicePlugin.extraArgs
  extraArgs:
    - -v=4
  ## @skip devicePlugin.extraEnvs
  extraEnvs: {}
  ## @skip devicePlugin.service
  service:
    type: NodePort  # Default type is NodePort, can be changed to ClusterIP
    httpPort: 31992
    labels: {}
    annotations: {}

  ## @skip devicePlugin.pluginPath
  pluginPath: /var/lib/kubelet/device-plugins
  ## @skip devicePlugin.libPath
  libPath: /usr/local/vgpu

  ## @skip devicePlugin.podAnnotations
  podAnnotations: {}
  ## @skip devicePlugin.hostPID
  hostPID: true
  # Let HAMi core ask the device plugin for its host PID.
  # This requires hostPID to be true.
  ## @skip devicePlugin.hostPIDBroker
  hostPIDBroker:
    enabled: false
  ## @skip devicePlugin.hostNetwork
  hostNetwork: false
  ## @skip devicePlugin.securityContext
  securityContext:
    privileged: true
    allowPrivilegeEscalation: true
    capabilities:
      drop: ["ALL"]
      add: ["SYS_ADMIN"]
  ## @skip devicePlugin.nvidiaNodeSelector
  nvidiaNodeSelector:
    gpu: "on"
  # NVIDIA GPU Operator commonly taints GPU nodes with this NoSchedule taint.
  ## @skip devicePlugin.tolerations
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  ## @skip devicePlugin.updateStrategy
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

  ## @skip devicePlugin.resources
  resources: {}
    # If you do want to specify resources, uncomment the following lines, adjust them as necessary.
    # and remove the curly braces after 'resources:'.
#    limits:
#       cpu: 1000m
#       memory: 1000Mi
#    requests:
#      cpu: 100m
#      memory: 100Mi

## @skip mockDevicePlugin
mockDevicePlugin:
  enabled: false
  image:
    registry: "docker.io"
    repository: "projecthami/mock-device-plugin"
    tag: "1.0.1"
    ## Specify a imagePullPolicy
    ## Defaults to 'Always' if image tag is 'latest', else set to 'IfNotPresent'
    ## ref: https://kubernetes.io/docs/user-guide/images/#pre-pulling-images
    ##
    pullPolicy: IfNotPresent
    ## Optionally specify an array of imagePullSecrets.
    ## Secrets must be manually created in the namespace.
    ## Example:
    ## pullSecrets:
    ##   - myRegistryKeySecretName
    ##
    pullSecrets: []
## @section Device configuration
devices:
  ## @skip devices.metax
  metax:
    resourceCountName: "metax-tech.com/gpu"
    resourceVCountName: "metax-tech.com/sgpu"
    resourceVCoreName: "metax-tech.com/vcore"
    resourceVMemoryName: "metax-tech.com/vmemory"
    sgpuTopologyAware: false
  ## @skip devices.hygon
  hygon:
    memoryFactor: 1
    resourceCountName: "hygon.com/hcunum"
    resourceMemoryName: "hygon.com/hcumem"
    resourceCoreName: "hygon.com/hcucores"
  ## @skip devices.cambricon
  cambricon:
    resourceCountName: "cambricon.com/vmlu"
    resourceMemoryName: "cambricon.com/mlu.smlu.vmemory"
    resourceCoreName: "cambricon.com/mlu.smlu.vcore"
  ## @skip devices.amd
  amd:
    resourceCountName: "amd.com/gpu"
    resourceMemoryName: "amd.com/gpumem"
    resourceCoreName: "amd.com/gpucores"
    customresources:
      - amd.com/gpu
      - amd.com/gpumem
      - amd.com/gpucores
  ## @skip devices.awsneuron
  awsneuron:
    resourceCountName: "aws.amazon.com/neuron"
    resourceCoreName: "aws.amazon.com/neuroncore"
    customresources:
      - aws.amazon.com/neuron
      - aws.amazon.com/neuroncore
  kunlun:
    ## @skip devices.kunlun.resourceCountName
    resourceCountName: "kunlunxin.com/xpu"
    ## @skip devices.kunlun.resourceVCountName
    resourceVCountName: "kunlunxin.com/vxpu"
    ## @skip devices.kunlun.resourceVMemoryName
    resourceVMemoryName: "kunlunxin.com/vxpu-memory"
    ## @skip devices.kunlun.enabled
    enabled: true
    ## @param devices.kunlun.customresources Additional resource names forwarded to the scheduler extender; standard resources are added automatically from the named resource fields.
    customresources: []
  enflame:
    ## @skip devices.enflame.resourceNameGCU
