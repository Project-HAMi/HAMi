  iluvatar:
    # devices.iluvatar.configs -- Iluvatar chip configurations with chipName, commonWord and resource names; an override replaces the complete default chip list.
    # @default -- See the complete list in [values.yaml](values.yaml).
    configs:
      - chipName: MR-V100
        commonWord: MR-V100
        resourceCountName: iluvatar.ai/MR-V100-vgpu
        resourceMemoryName: iluvatar.ai/MR-V100.vMem
        resourceCoreName: iluvatar.ai/MR-V100.vCore
      - chipName: MR-V50
        commonWord: MR-V50
        resourceCountName: iluvatar.ai/MR-V50-vgpu
        resourceMemoryName: iluvatar.ai/MR-V50.vMem
        resourceCoreName: iluvatar.ai/MR-V50.vCore
      - chipName: BI-V150
        commonWord: BI-V150
        resourceCountName: iluvatar.ai/BI-V150-vgpu
        resourceMemoryName: iluvatar.ai/BI-V150.vMem
        resourceCoreName: iluvatar.ai/BI-V150.vCore
      - chipName: BI-V100
        commonWord: BI-V100
        resourceCountName: iluvatar.ai/BI-V100-vgpu
        resourceMemoryName: iluvatar.ai/BI-V100.vMem
        resourceCoreName: iluvatar.ai/BI-V100.vCore
    # devices.iluvatar.enabled -- Enable Iluvatar handling in the scheduler and its extender resource list.
    enabled: false
    # devices.iluvatar.customresources -- Resource names forwarded to the scheduler extender for this vendor; update this list when changing its runtime resource names.
    customresources:
      - iluvatar.ai/BI-V100-vgpu
      - iluvatar.ai/BI-V100.vCore
      - iluvatar.ai/BI-V100.vMem
      - iluvatar.ai/BI-V150-vgpu
      - iluvatar.ai/BI-V150.vCore
      - iluvatar.ai/BI-V150.vMem
      - iluvatar.ai/MR-V100-vgpu
      - iluvatar.ai/MR-V100.vCore
      - iluvatar.ai/MR-V100.vMem
      - iluvatar.ai/MR-V50-vgpu
      - iluvatar.ai/MR-V50.vCore
      - iluvatar.ai/MR-V50.vMem

# legacyMetrics -- Expose legacy metric names alongside the current scheduler and vGPU monitor metrics.
legacyMetrics: false

prometheus:
  # prometheus.enabled -- Render Prometheus Operator ServiceMonitor resources; requires the ServiceMonitor CRD.
  enabled: false

# Full replacement of device-config.yaml; takes precedence over a bundled file and values.
# This is a complete document, not a merge; prefer devices.<vendor> fields for partial overrides.
device-config:
  # device-config.content -- Complete device-config.yaml replacement, taking precedence over a bundled files/device-config.yaml and values. Non-empty content does not merge with the structured defaults.
  content: ""
